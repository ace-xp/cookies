events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream cookies_api {
    server api:18080;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # 对齐后端 assets.MaxVideoBytes（200MB），再留 10MB 给 multipart 边界和
    # 表单字段。设小了 nginx 会先于后端返回 413，前端只看到"上传失败"，
    # 后端日志里什么都没有——真正的大小校验在 Go 那边分档做（图片 20MB、
    # 视频 200MB、文档 10MB），这里只负责别提前掐断。
    client_max_body_size 210m;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

    location /api/ {
      proxy_pass http://cookies_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    location /platform/ {
      proxy_pass http://cookies_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
      proxy_pass http://cookies_api/healthz;
    }

    location = /readyz {
      proxy_pass http://cookies_api/readyz;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
