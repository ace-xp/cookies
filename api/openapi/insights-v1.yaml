  /api/insights/v1/projects/{project_id}/miyun/product-source:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Read Project-scoped product identities available to Miyun analysis
      operationId: getMiyunProductSource
      responses:
        '200':
          description: Human-readable Project product identities, never a global product catalogue.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MiyunProductSource'}
