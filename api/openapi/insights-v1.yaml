                  items:
                    type: array
                    items: {$ref: '#/components/schemas/MiyunProductProfile'}
        default: {$ref: '#/components/responses/Problem'}
  /api/insights/v1/projects/{project_id}/miyun/product-profiles:analyze:
    parameters:
