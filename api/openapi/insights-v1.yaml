  /api/insights/v1/projects/{project_id}/miyun/connection:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Get the safe public Miyun connection state
      operationId: getMiyunConnection
      responses:
        '200':
          description: Encrypted-session metadata; the session is never returned.
          content: {application/json: {schema: {$ref: '#/components/schemas/MiyunConnection'}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      summary: Create or rotate the encrypted Miyun session
      operationId: updateMiyunConnection
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateMiyunConnectionRequest'}}}
      responses:
        '200':
          description: Updated safe connection state.
          content: {application/json: {schema: {$ref: '#/components/schemas/MiyunConnection'}}}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/insights/v1/projects/{project_id}/miyun/connection:verify:
