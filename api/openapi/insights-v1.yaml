openapi: 3.1.0
info:
  title: Cookies Insights API
  version: 1.0.0
  description: Evidence-backed reports, confirmation, and reusable experience.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /api/insights/v1/projects/{project_id}/reports:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List insight reports
      operationId: listInsightReports
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Project reports.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InsightReport'
        default:
          $ref: '#/components/responses/Problem'
    post:
      summary: Create an evidence-backed report
      operationId: createInsightReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReport'
      responses:
        '201':
          description: Draft report created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightReport'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/reports/{report_id}:confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ReportID'
    post:
      summary: Confirm an insight report
      operationId: confirmInsightReport
      requestBody:
        $ref: '#/components/requestBodies/ExpectedVersion'
      responses:
        '200':
          description: Human-confirmed report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightReport'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/reports/{report_id}/submit:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ReportID'
    post:
      summary: 提交这一轮复盘——写摘要、挂投放执行、定格系统发现、置为已确认
      description: |
        一条 UPDATE 里做四件事：写下这一轮的一句话摘要、记下算哪次投放、把系统发现
        定格进 `digest`（和人一路记的那几笔合并去重）、状态改成 `confirmed`。
        拆开做会留下「已确认但没有系统发现」的报告，而它看起来和正常的一模一样。

        系统发现在**提交这一刻**才算，不是草稿一建就补：草稿是活的，一建就补的话，
        人记第一笔时那批数字到提交时早就不是那个数了，而报告上不会写它是哪天算的。

        和 `:confirm` 的区别就在这四件事——`:confirm` 只改状态。已提交的报告不能再提交。
      operationId: submitInsightReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReview'
      responses:
        '200':
          description: 定格之后的复盘全文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightReport'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/findings:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      summary: 记一笔——把分析页上的一条结论钉进本轮复盘草稿
      description: |
        分析页唯一的写操作。请求体里**没有** confidence / verdict：判定由后端拿
        (window, dimension, source_ref, variable) 回到那次分析结果里找回来。
        目标复盘草稿按 (项目 + 窗口) 自动 find-or-create，不需要先建复盘。
        屏幕上不存在这一条时返回 400。
      operationId: pinInsightFinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinFinding'
      responses:
        '200':
          description: 记入后的复盘草稿全文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightReport'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/reports/{report_id}:drop-finding:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ReportID'
    post:
      summary: Drop or restore one auto-filled finding
      description: |
        报告页上人只做删减——加不了新的一条。写进去的每条发现都得能回溯到某次对比、
        某个实验或某条经验，在报告页手打一条就断了这个链子。要加只能回分析页记一笔
        （`POST /findings`），那条路上判定是后端回查的，出处照样留得住。只有草稿能改。
      operationId: dropInsightReportFinding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DropReportFinding'
      responses:
        '200':
          description: Report with the finding marked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightReport'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/reports/{report_id}:create-experience:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ReportID'
    post:
      summary: Create reusable experience
      operationId: createExperienceFromReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperience'
      responses:
        '201':
          description: Reusable confirmed experience.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List reusable experience
      operationId: listExperiences
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Filter by lifecycle status. Omit to include every revision.
          schema:
            $ref: '#/components/schemas/ExperienceStatus'
      responses:
        '200':
          description: Project experience, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Experience'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences/lookup:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      summary: Look up experience that applies to the round about to be produced
      description: >
        A read that uses POST: the lookup carries seven conditions, several of
        them free text, which are unreadable and easy to mis-escape in a query
        string. Only confirmed experience is searched; observed-only entries are
        withheld unless include_observed is set.
      operationId: lookupExperiences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperienceLookup'
      responses:
        '200':
          description: Matching experience with the reason each one matched.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExperienceMatch'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences/{experience_id}:confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExperienceID'
    post:
      summary: Confirm an experience so downstream Skills may quote it
      operationId: confirmExperience
      requestBody:
        $ref: '#/components/requestBodies/ExpectedVersion'
      responses:
        '200':
          description: Confirmed experience. A superseded predecessor is retired atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences/{experience_id}:reject:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExperienceID'
    post:
      summary: Reject a pending experience without deleting it
      operationId: rejectExperience
      requestBody:
        $ref: '#/components/requestBodies/ExperienceTransition'
      responses:
        '200':
          description: Retired experience, still auditable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences/{experience_id}:request-review:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExperienceID'
    post:
      summary: Flag a confirmed experience as needing review
      operationId: requestExperienceReview
      requestBody:
        $ref: '#/components/requestBodies/ExperienceTransition'
      responses:
        '200':
          description: Experience moved to needs_review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences/{experience_id}:retire:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExperienceID'
    post:
      summary: Retire an experience (logical delete)
      operationId: retireExperience
      requestBody:
        $ref: '#/components/requestBodies/ExperienceTransition'
      responses:
        '200':
          description: Retired experience. Its reference history stays readable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences/{experience_id}:revise:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExperienceID'
    post:
      summary: Append a new revision instead of overwriting the conclusion
      operationId: reviseExperience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseExperience'
      responses:
        '201':
          description: Pending revision. It supersedes its predecessor only once confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experience'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences/{experience_id}:record-reference:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExperienceID'
    post:
      summary: Record how a downstream consumer used the experience
      operationId: recordExperienceReference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordExperienceReference'
      responses:
        '201':
          description: Reference record with adoption feedback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceReference'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experience-references:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List downstream references of every experience in the project
      operationId: listProjectExperienceReferences
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Reference records across all experiences, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExperienceReference'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences/{experience_id}/references:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExperienceID'
    get:
      summary: List downstream references of one experience
      operationId: listExperienceReferences
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Reference records, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExperienceReference'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences/{experience_id}/audits:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExperienceID'
    get:
      summary: List the status trail of one experience
      operationId: listExperienceAudits
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Append-only status trail, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExperienceAudit'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/experiences/{experience_id}/lineage:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/ExperienceID'
    get:
      summary: List every revision of one conclusion
      operationId: listExperienceLineage
      responses:
        '200':
          description: Revisions of the lineage, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Experience'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/prelaunch:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Get pre-launch insight cards
      operationId: getPreLaunchInsights
      description: |
        Projects confirmed experience into 洞察卡 for the next cycle. Filters
        narrow by the current Project's channel / creative type / objective;
        experiences that never declared an applicability scope are excluded
        while a filter is set and counted in unscoped_excluded, so they are
        never dropped silently.
      parameters:
        - name: channel
          in: query
          schema: { type: string, maxLength: 96 }
        - name: creative_type
          in: query
          schema: { type: string, maxLength: 96 }
        - name: objective
          in: query
          schema: { type: string, maxLength: 96 }
        - name: q
          in: query
          description: Free-text match over conclusion, conditions, action and content features.
          schema: { type: string, maxLength: 200 }
        - name: cross_channel
          in: query
          description: |
            Cross-channel comparison is off by default (PRD 03 §10.3②) because
            channel metrics are not directly comparable. Set true only after
            the user explicitly asks for a merged view.
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Confirmed experience references for the next cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreLaunchInsight'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/performance:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Get the performance evidence projection
      operationId: getPerformanceOverview
      responses:
        '200':
          description: Read-only projection of Delivery evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/feature-schemas:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List the six type-specific feature systems
      description: >-
        Reference data from 03 §5. Each asset type carries only the fields its own
        content supports, which is what stops a video hook field from being asked
        of a WeChat article (03 §15②).
      operationId: listFeatureSchemas
      responses:
        '200':
          description: Feature systems in PRD order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeatureSchema'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/feature-matrix:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Compare several assets on their shared features
      description: >-
        Mixed-type comparisons are narrowed to the keys every selected type
        declares, and the response states that narrowing in `disclosure`.
      operationId: getFeatureMatrix
      parameters:
        - name: asset_ids
          in: query
          required: true
          description: Repeatable or comma separated; 1..50 assets.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
      responses:
        '200':
          description: Feature matrix over the selected assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureMatrix'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List analysable assets
      description: >-
        Every visible library tab is a different query here (22 §8.3): 全部素材 has
        no filter, 待匹配 filters on `awaiting_match`, 待提取 on `analysable`, and
        版本关系 on `lineage_id`.
      operationId: listInsightAssets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Repeatable or comma separated analysis statuses.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AnalysisStatus'
          style: form
          explode: true
        - name: asset_type
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AssetType'
          style: form
          explode: true
        - name: source_kind
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AssetSourceKind'
          style: form
          explode: true
        - name: lineage_id
          in: query
          description: Restrict to one creative's revision chain.
          schema: { type: string }
        - name: role
          in: query
          description: >-
            Omitting this returns analysis assets only. The ledger holds every
            asset the platform ever produced and would otherwise swamp the four
            analysis queues.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AssetRole'
          style: form
          explode: true
        - name: cursor
          in: query
          description: Opaque `next_cursor` from the previous page.
          schema: { type: string }
        - name: q
          in: query
          description: Case-sensitive substring match on the title.
          schema: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Matching assets, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InsightAsset'
                  next_cursor:
                    type: string
                    description: >-
                      Absent when this is the last page. Pass it back as `cursor`
                      to fetch the next one.
        default:
          $ref: '#/components/responses/Problem'
    post:
      summary: Index a creative revision for analysis
      description: >-
        An empty `lineage_id` starts a new lineage; a known one appends a revision
        so the same creative keeps one identity across edits (AM-001).
      operationId: indexInsightAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexAsset'
      responses:
        '201':
          description: Indexed asset revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    get:
      summary: Get one asset revision
      operationId: getInsightAsset
      responses:
        '200':
          description: One asset revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}/lineage:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    get:
      summary: List every revision of the same creative
      operationId: listInsightAssetLineage
      responses:
        '200':
          description: Revisions in ascending order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InsightAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/similar:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      summary: Find similar assets by feature overlap
      description: >-
        Two ways to ask: pass `asset_id` for "what else looks like this one", or
        pass `features` for "what else has 时长=15s". The second is the escape
        hatch for a ❓ verdict — when this round has too few assets on a variable,
        pulling in library assets with the same value makes the sample thick
        enough to judge.


        Similarity is feature overlap, never a vector score: every hit must be
        able to state *where* it is similar. A recommendation nobody can explain
        is a recommendation nobody dares use in a review meeting. Each reason
        carries its `source`, and `admissible_overlap` counts only the
        `derived`/`human` variables — the ones allowed into attribution.
      operationId: findSimilarInsightAssets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimilarAssetRequest'
      responses:
        '200':
          description: Ranked matches, most attributable overlap first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarAssetResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/external-assets:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      summary: Import an off-platform asset as evidence
      description: >-
        **External assets never enter the shared asset library.** The library is
        owned by 创意创作 and holds only platform assets, because anything in it
        can be sent out to a live campaign — and an off-platform asset carries no
        such licence. Nothing here is ever written to `insight_assets`.


        Insight still needs these files: "what does the rest of the industry ship
        for this kind of asset" is unavoidable when explaining a round's result.
        So they live as *evidence*: read-only, with a declared purpose, and with
        a retention deadline. Editing is not offered — re-import instead, because
        editing a piece of evidence is tampering with it.


        `window_end` is the end date of the review window this asset was imported
        to explain. Retention runs from there, not from the import date: the two
        have the same usefulness, and counting from the import date would keep a
        mid-campaign import a month longer for no reason. When the deadline
        passes only the original file is deleted; the row and the human-tagged
        features stay, so a review that cited this asset still says what was seen.
      operationId: importExternalInsightAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportExternalAssetRequest'
      responses:
        '201':
          description: The stored evidence row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAsset'
        default:
          $ref: '#/components/responses/Problem'
    get:
      summary: List the project's external evidence
      description: >-
        Newest first. Rows whose `original_purged` is true have passed their
        retention deadline: the file is gone, the declared features remain.
      operationId: listExternalInsightAssets
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: External evidence for this project.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}/features:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    get:
      summary: List one asset's extracted features
      description: >-
        Both layers are returned: the AI inference and the human conclusion for
        the same key are separate rows and neither overwrites the other (§14).
      operationId: listInsightAssetFeatures
      responses:
        '200':
          description: Features of one asset, both layers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssetFeature'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      summary: Write the human conclusion layer
      description: >-
        PATCH rather than PUT: it adds or replaces the human row only and leaves
        the AI row beside it untouched (AM-006). Confidence is rejected here —
        a person's conclusion carries no machine confidence.
      operationId: patchInsightAssetFeatures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchFeatures'
      responses:
        '200':
          description: All features of the asset after the patch.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssetFeature'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}:identify-type:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    post:
      summary: Identify the asset's content type
      description: >-
        AM-004. An AI answer must carry a confidence level and a human answer must
        not. Changing the type after features exist is refused, because the old
        feature system's values would be orphaned.
      operationId: identifyInsightAssetType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentifyAssetType'
      responses:
        '200':
          description: Asset with its type identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}:extract-features:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    post:
      summary: Write the AI inference layer
      description: >-
        AM-005. Every key must belong to this asset type's own feature system and
        every value must match the kind that system declares, so the write is
        rejected before it reaches storage rather than producing a meaningless
        comparison later (03 §15②).
      operationId: extractInsightAssetFeatures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractFeatures'
      responses:
        '200':
          description: All features of the asset after extraction.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssetFeature'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}:analyze:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    post:
      summary: Run AI feature extraction on the asset
      description: >-
        AM-005, the AI half. The model is asked for exactly this asset type's own
        feature system, and its answer only ever writes the AI inference layer —
        the asset lands in 待确认 and waits for a person (03 §14, 09 §8).

        Only a human action reaches this endpoint. Nothing enqueues extraction
        automatically: an auto-filled review queue is a review queue nobody reads,
        and review is the only quality gate this module has.

        `content` is required because the asset library stores an asset's identity
        and state, not its body — the caller supplies the text or shot description
        to analyse.
      operationId: analyzeInsightAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeAsset'
      responses:
        '200':
          description: The run that was recorded, plus the features it wrote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAssetResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}/analysis-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
      - $ref: '#/components/parameters/AnalysisRunStatusFilter'
      - $ref: '#/components/parameters/Limit'
    get:
      summary: Analysis history of one asset
      description: >-
        Backs 素材详情页「数据与方法」 (03 §82): every conclusion must be traceable to the
        asset, the data cut-off, the metric version and the Skill/algorithm version.
        Failed runs are listed too — a success rate that only counts successes is
        always 100%.
      operationId: listInsightAssetAnalysisRuns
      responses:
        '200':
          description: Runs for this asset, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalysisRun'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/analysis-runs:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AnalysisRunKindFilter'
      - $ref: '#/components/parameters/AnalysisRunStatusFilter'
      - $ref: '#/components/parameters/Limit'
    get:
      summary: Analysis runs across the project
      description: >-
        Backs 分析任务成功率、P95 时长和数据新鲜度 in 能力运营 (03 §310).
      operationId: listInsightAnalysisRuns
      responses:
        '200':
          description: Runs in the project, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalysisRun'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}:confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    post:
      summary: Confirm the content analysis
      description: >-
        Refused while any AI value is still unreviewed, so 已确认 always means a
        person looked at every field (AM-006). Requires the confirm scope.
      operationId: confirmInsightAssetAnalysis
      requestBody:
        $ref: '#/components/requestBodies/AssetTransition'
      responses:
        '200':
          description: Confirmed asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}:request-review:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    post:
      summary: Send a confirmed analysis back for review
      operationId: requestInsightAssetReview
      requestBody:
        $ref: '#/components/requestBodies/AssetTransitionWithReason'
      responses:
        '200':
          description: Asset moved to 待复审.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}:promote:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    post:
      summary: Pull a ledger asset into analysis
      description: >-
        The only way out of the ledger, and it always takes a person. Most
        ledger assets never go live, so nothing promotes them automatically.
        Analysis progress is untouched — role and analysis_status are separate
        dimensions.
      operationId: promoteInsightAssetToAnalysis
      requestBody:
        $ref: '#/components/requestBodies/AssetTransitionWithReason'
      responses:
        '200':
          description: The asset, now an analysis object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}:return-to-ledger:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    post:
      summary: Send a wrongly promoted asset back to the ledger
      description: >-
        Only assets that never matched a platform object can go back. A matched
        asset has spend and attribution behind it; hiding it from the queues
        would hide data that already exists.
      operationId: returnInsightAssetToLedger
      requestBody:
        $ref: '#/components/requestBodies/AssetTransitionWithReason'
      responses:
        '200':
          description: The asset, back on the books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/assets/{asset_id}:retire:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/AssetID'
    post:
      summary: Retire an asset revision
      description: Logical retirement — the row and its features stay readable.
      operationId: retireInsightAsset
      requestBody:
        $ref: '#/components/requestBodies/AssetTransitionWithReason'
      responses:
        '200':
          description: Retired asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/asset-mappings:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List platform-object mappings
      description: The 待匹配 queue filters this on `status=unmatched` (AM-003).
      operationId: listInsightAssetMappings
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MappingStatus'
          style: form
          explode: true
        - name: platform
          in: query
          schema: { type: string }
        - name: asset_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Matching mappings.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssetMapping'
        default:
          $ref: '#/components/responses/Problem'
    post:
      summary: Register a platform creative or ad
      description: >-
        Omitting `asset_id` files the object in the 待匹配 queue rather than
        guessing which asset revision it belongs to.
      operationId: registerInsightAssetMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAssetMapping'
      responses:
        '201':
          description: Registered mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetMapping'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/asset-mappings/{mapping_id}:resolve:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/MappingID'
    post:
      summary: Point a queued platform object at an asset revision
      description: >-
        Matching requires an `asset_id`; ignoring requires a reason. Both are
        recorded with the deciding user, so the match is auditable (AM-003).
      operationId: resolveInsightAssetMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveAssetMapping'
      responses:
        '200':
          description: Resolved mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetMapping'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/data-sources:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List ad-data sources
      description: >-
        Backs 数据接入 · 数据源 and 字段映射 — the same rows read through two
        lenses (doc10 §2/§8).
      operationId: listInsightDataSources
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DataSourceStatus'
          style: form
          explode: true
        - name: platform
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Platform'
          style: form
          explode: true
      responses:
        '200':
          description: Matching data sources.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataSource'
        default:
          $ref: '#/components/responses/Problem'
    post:
      summary: Register a data source
      description: >-
        A new source starts as draft and cannot import until a field mapping
        exists. `credential_ref` is a key into the secret service — a raw token
        is rejected, never stored (doc10 §9).
      operationId: registerInsightDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDataSource'
      responses:
        '201':
          description: Registered data source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/data-sources/{data_source_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/DataSourceID'
    get:
      summary: Read one data source
      operationId: getInsightDataSource
      responses:
        '200':
          description: The data source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      summary: Update caliber, field mapping or lifecycle
      description: >-
        The 接入向导 sends only the step it just finished, which is why this is
        PATCH. Activating without a field mapping is refused.
      operationId: updateInsightDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataSource'
      responses:
        '200':
          description: Updated data source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/data-sources/{data_source_id}:set-quality:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/DataSourceID'
    post:
      summary: Record a data-quality state
      description: >-
        doc10 §11. Anything other than healthy must carry a reason, because the
        state is shown next to every number the source feeds, and doc10 §12.4
        stops those numbers from producing a strong conclusion.
      operationId: setInsightDataSourceQuality
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDataSourceQuality'
      responses:
        '200':
          description: Updated data source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/import-batches:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List import batches
      description: Backs 数据接入 · 导入任务 and 同步记录, filtered by kind (doc10 §7).
      operationId: listInsightImportBatches
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: data_source_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ImportStatus'
          style: form
          explode: true
      responses:
        '200':
          description: Matching batches, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ImportBatch'
        default:
          $ref: '#/components/responses/Problem'
    post:
      summary: Import canonical daily metrics
      description: >-
        Re-sending the same `(platform object, stat date, caliber)` overwrites
        that row rather than adding to it (doc10 §7 幂等键), and a repeat of the
        same `content_hash` over the same window is refused outright (§8) — file
        a `correction` batch instead. Bad rows are rejected individually: the
        batch still commits the rest and returns 201 with `status: partial`, so
        the caller has a batch id to inspect `errors` with.
      operationId: importInsightMetrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMetrics'
      responses:
        '201':
          description: The batch, including partial success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/metric-overview:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Post-launch metric overview
      description: >-
        Backs 投后分析 · 指标总览 (20 §4.1 一个主图表 + 素材矩阵 + 解释区). The
        payload always carries the four things that section requires on screen:
        数据窗口 (`window`)、样本量 (`totals.impressions`)、口径 (`caliber`) 和
        置信范围 (`confidence` + `ctr_interval`). Both window ends default to the
        last 30 days ending today and are echoed back, so two people reading the
        same chart are never reading two different periods.
      operationId: getInsightMetricOverview
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: The overview for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricOverview'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/performance-analysis:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Post-launch variant / trend / fatigue / anomaly / driver analysis
      description: |
        投后分析除总览外的五个二级视图（素材对比、趋势、疲劳、异常、驱动因素）共用
        这一个响应。和 metric-overview 分开，是因为总览只读指标事实，这里还要读素材
        特征；五个视图不再各自读一次，否则「趋势里看到的」和「疲劳里算的」会来自两次
        不同的读取，对不上时没人解释得清。


        全篇只有一条纪律：**能不能归因，和差异有多大，是两件事**。任何一条结论都带
        `confidence` 和一句 `note` 说明为什么是这个档位；`comparisons[].verdict` 只有
        在「只改了一个特征 + 两侧样本都够 + 置信区间不重叠」时才会是 `attributable`
        (AM-009)。
      operationId: getInsightPerformanceAnalysis
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: The five analyses for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceAnalysis'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/capability-operations:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Capability operations governance surface
      description: |
        能力运营的五个二级视图（特征体系 · 指标字典 · 分析 Skills · 评测集 · 质量看板）
        共用这一个响应。20 §4.1 给这个模块的职责是「防止特征碎片化和指标口径漂移，
        支持算法升级与回归」，22 §6.2 限定只有分析运营角色可见。


        **这个模块不建表**。特征体系读 `features.go` 的六套 schema，指标字典是 Go 里
        声明的常量，Skill 健康度和评测集从已有的特征行现算。可编辑的口径是没有意义的
        口径——它能被人静默改掉，而 03 §14 要求口径变更后能重算且不静默改写历史结论。


        `evaluations` 有一条必须写在前面的边界：**它不是独立评测集**。样本全部来自人工
        复核记录，回答的是「被人看过的地方机器错了多少」，不是整体准确率。没人复核过的
        提取一条都不计入——把它们算成「机器对了」，准确率会随提取量自动上涨。样本少于
        10 条时 `accuracy` 恒为 0 且 `confidence` 为 `low_sample`，前端此时必须藏起
        准确率而不是显示一个「100%」。


        `merge_candidates` 是候选不是结论：只有全项目仅一条素材用过的取值才会进队列，
        系统不做语义猜测。把两个真正不同的取值合并，比词表碎片化更糟。
      operationId: getInsightCapabilityOperations
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: The governance snapshot for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityOperations'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/settings:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Insight settings
      description: |
        「设置」入口下各组共用这一个响应。20 §121 要求「重要阈值显示影响说明和
        默认推荐；不使用仪表盘布局」；22 §239 记的问题正是「缺少实际阈值影响说明」。


        **这个端点本身只读。** 决定三档结论的那七个阈值可以改，改法是
        `PUT /thresholds`——响应里带 `editable_key` 的格子就是那七个。
        其余的值仍然是代码常量，一律只读：它们里面有一批是保护性上限
        （导入行数、最长窗口这类），做成可配置等于把防呆做成了可关闭。


        不管可写不可写，返回的数字都取自**正在生效的那份**（没人调过时逐格退回
        代码常量），而不是另抄一份——抄一份迟早会和代码对不上，那时候这一页
        就从说明变成误导。


        路径上带 `project_id` 只为沿用同一套鉴权（需要 `insights.read`）。
        `project_scoped` 恒为 `false`：这些值对整个部署生效，不因项目而不同。


        分组的 `state` 有两个取值。`in_effect` 表示这一组的值现在真的在生效，
        页面上的判定就是按它们做的；`not_built` 表示这一组还没有任何东西，此时
        `items` 为空而 `missing` 说明缺什么。**前端必须把两者渲染成不同的样子**——
        「通知」一组当前是 `not_built`，把它画成一张空表单，读的人会以为通知在后台
        默默生效，而实际上代码里没有一处会主动往外发消息。
      operationId: getInsightSettings
      responses:
        '200':
          description: The thresholds and rules currently in effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSettings'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/thresholds:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Judgement thresholds in effect
      description: |
        现在生效的那一份判定阈值，每格都有值，且带 `version`。没人调过时
        `version` 为 0，各格取代码里的出厂设定。


        这些数字决定三档结论怎么判：多少曝光算「充分」、几天才给趋势、
        几条素材才谈驱动因素。每条结论都盖着它用的那一版号
        （`Judgement.threshold_version`），所以改完阈值之后回头看一条老结论，
        仍然查得到它是按什么标准算的。
      operationId: getThresholds
      responses:
        '200':
          description: The resolved thresholds currently in effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedThresholds'
        default:
          $ref: '#/components/responses/Problem'
    put:
      summary: Save judgement thresholds (appends a version)
      description: |
        **只增版本，从不原地改。** 服务端追加一版并返回解析后的新一份；
        已经判出去的结论保持原样，从此刻起判出来的按新版本算。


        用 `PUT` 而不是 `POST`：从调用方看这是「把阈值设成这样」，幂等语义对得上；
        内部追加一版是实现细节。


        `values` 里只填要改的格子，**没填的格子表示「没人调过」，跟着代码默认值走**，
        不是 0。存成 0 的话，将来改了代码默认值，那些从没被调过的部署不会跟着走，
        而它们本来应该跟着走。


        `reason` 必填（1~1000 字）。改判定标准是一件要负责的事；写不出理由的改动
        多半是试出来的，而试出来的阈值三个月后没人说得清为什么是这个数。


        需要 `insights.confirm`，不是 `insights.write`：改的是全组织的判定标准，
        影响面比写一条数据大得多，应该和「确认经验」同一个门槛。


        400 的情形：理由为空或过长；任何一格 ≤ 0；趋势天数低于 3 或异常天数低于 4
        （再低就等于把「拒绝下结论」这条规则关掉）；充分门槛低于方向门槛
        （那样一个样本量会同时满足两档，谁生效取决于代码里 if 的先后）。
      operationId: saveThresholds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveThresholdsRequest'
      responses:
        '200':
          description: The newly appended version, resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedThresholds'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/thresholds/history:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Threshold change history
      description: >-
        阈值的改动史，版本号从大到小。它和「只增版本」是一件事的两面：只增版本让
        历史存得下来，这个端点让历史看得见——看不见的话，一条盖着「第 3 版」的结论，
        人查不到第 3 版当时是什么数、为什么改，那个版本号也就等于没有。
      operationId: listThresholdHistory
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Threshold sets, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ThresholdSet'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/data-quality:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: Data quality queue
      description: >-
        doc10 §10 写的是 `GET /api/insights/v1/data-quality`；这里挂在 project 下，
        因为质量问题全部由某个 Project 的数据源和指标算出，不带 project 服务端得替
        调用方猜项目。文档冲突已登记在功能基线 §8。


        六个二级视图（新鲜度·缺失·异常·口径·对账·修复队列）共用这一个响应，不拆成
        六个端点：它们共用同一套排序和队列判断，拆开会让「队列里还有几条」在不同视图
        里算出不同的数。前端按 `issues[].kind` 过滤，角标读 `by_kind`。


        问题本身不入库，每次实时算出；`state` 是把实时检测结果与库里的处置记录比对
        后的结论，其中 `reopened` 表示有人报了修但问题在那之后又被观测到。
      operationId: getInsightDataQuality
      parameters:
        - name: start
          in: query
          schema: { type: string, format: date }
        - name: end
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: The quality report for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityReport'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/data-quality/dispositions:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    post:
      summary: Record a disposition on a quality issue
      description: >-
        记一次处置：跟进中 / 已修复 / 已忽略，三者都必须写明依据 (PRD §12 可追溯)。
        同一条问题再次处置是覆盖同一行并抬高 version，所以这里不是幂等创建也没有
        DELETE——撤销处置也是一次处置，「谁在什么时候改了主意」不该从记录里消失。
      operationId: resolveInsightQualityIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveQualityIssue'
      responses:
        '201':
          description: The stored disposition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityDisposition'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/insight-experiments:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List experiments
      description: >-
        实验列表（03 §7.3 / AM-009）。返回的每个实验都带它的分组，不单独出分组端点：
        一个实验离开它的分组没有意义，分两次读只会让列表页在两次请求之间显示
        「有实验、没有组」的中间状态。


        这里不带读数（样本量、对比、判定）——那些要按窗口聚合日指标，列表页
        逐个实验算一遍会很慢，而列表页也用不上。要读数请打详情。
      operationId: listInsightExperiments
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ExperimentStatus'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Experiments in this project.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Experiment'
        default:
          $ref: '#/components/responses/Problem'
    post:
      summary: Register an experiment
      description: >-
        建实验就是**事先登记**：被测变量、分组、每组最低展示量，全部在看到结果之前定下。
        这是实验中心和投后分析「驱动因素」的唯一区别——那边是事后从已投数据里认出来的
        对照，排除不掉「这批素材本来就是被人挑出来投的」这个选择效应，所以只能说到相关。


        分组和实验一次建完：分两步建的话，中间那个「只有一组」的状态没有任何意义，
        却要多一套校验去容忍它。至少两组、恰好一个基线组，取值和名字都不能重复。


        `variable_key` 必须是 `asset_type` 那套特征体系里的字段，且不能是自由文本——
        自由文本的取值两条素材几乎不可能一样，分出来全是单元素组。
      operationId: createInsightExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExperiment'
      responses:
        '201':
          description: The registered experiment, in draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/insight-experiments/{experiment_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: experiment_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Experiment detail with a live readout
      description: >-
        实验本身加上此刻的读数：每组的样本量、够不够事先定的门槛、以及过了门槛的
        那些对比。


        **没有单独的「样本检查」端点。** 样本量是这一页唯一要回答的问题，另开一个
        端点会让页面在两次请求之间拿到对不上的两个数，而用户不知道该信哪个。


        读数每次现算，不落库：落库就会出现「页面显示的样本数是三天前的」。


        `comparisons[].blocked` 为 true 时 `result` 一定不存在。这是有意的——样本
        不达标却把 CTR 差异显示出来，人会先看见数字再看见提示，然后记住数字。
      operationId: getInsightExperiment
      responses:
        '200':
          description: The experiment and its current readout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentDetail'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/insight-experiments/{experiment_id}:start:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: experiment_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Freeze the groups and start the experiment
      description: >-
        **这一步是整个实验中心的支点。** 开跑之后分组冻结，谁也不能再往表现好的那组
        补素材。少了这个冻结，「事先登记」只是个说法，结论的可信度和事后凑对没有区别。


        每一组都必须已经有素材——开跑之后就补不上了。
      operationId: startInsightExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_version: { type: integer, format: int64 }
      responses:
        '200':
          description: The experiment, now running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/insight-experiments/{experiment_id}:conclude:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: experiment_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Conclude the experiment
      description: >-
        两个前提缺一不可：样本过了事先定的门槛（系统卡门槛），人写了解读（人负责说明）。


        **入参里没有判定。** 判定由系统按门槛和区间给出——判定要是能传，事先定的
        门槛就形同虚设。人只写 `interpretation`：只留一个判定，读的人无从知道这条
        结论该怎么用。


        样本没到门槛时返回 409：那时候下结论等于「凑够了就说显著」。
      operationId: concludeInsightExperiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConcludeExperiment'
      responses:
        '200':
          description: The concluded experiment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/insight-experiments/{experiment_id}/variants/{variant_id}/assets:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: experiment_id
        in: path
        required: true
        schema: { type: string }
      - name: variant_id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Put an asset into a group
      description: >-
        人从素材库挑，系统把关。三道关：


        1. 素材类型必须和实验登记的一致——两套特征体系不一样，放一起比不出这个变量。
        2. 素材在被测变量上的取值必须和这一组的 `variable_value` 对得上，对不上直接拦。
           放错组的素材会让整次实验比的都不是登记的那个变量。
        3. `controlled_keys` 里的特征和已入组素材不一致时**只给黄牌**（`warnings`），
           不拦。真实素材很难只差一个变量，硬拦会让实验一个也建不起来；但不说出来，
           结论就会被当成干净的对照。


        素材还没有被测变量的结论时也拦，并提示先去内容分析补上——不知道取值就不知道
        它该进哪一组。


        只在 `draft` 状态可用。已开跑返回 409。
      operationId: attachInsightExperimentAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [asset_id]
              properties:
                asset_id: { type: string }
      responses:
        '200':
          description: The updated group, plus any warnings raised by the controlled features.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachExperimentAssetResult'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/insight-experiments/{experiment_id}/variants/{variant_id}/assets/{asset_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
      - name: experiment_id
        in: path
        required: true
        schema: { type: string }
      - name: variant_id
        in: path
        required: true
        schema: { type: string }
      - name: asset_id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Remove an asset from a group
      description: 只在 `draft` 状态可用。已开跑返回 409——冻结是双向的，移出和加入一样会改变对照。
      operationId: detachInsightExperimentAsset
      responses:
        '200':
          description: The updated group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentVariant'
        default:
          $ref: '#/components/responses/Problem'
  /api/insights/v1/projects/{project_id}/miyun/product-profiles:
    parameters:
      - $ref: '#/components/parameters/ProjectID'
    get:
      summary: List versioned Miyun product analysis profiles
      operationId: listMiyunProductProfiles
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
