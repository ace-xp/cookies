    SubmitReview:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        summary:
          type: string
          maxLength: 200
          description: >-
            这一轮的一句话摘要，比如「7 月中旬短视频三版时长对比」。它是复盘列表主列上
            唯一能把几份复盘区分开的东西；提交之后报告不可改，所以这是全流程唯一能写它的
            时刻，界面上必须说清这一点。留空是允许的（逼人写一句话换来的多半是「复盘」
            两个字），留空时沿用报告已有的摘要，不会把已有的抹成空。
        execution_id:
          type: string
          description: >-
            这份复盘算哪次投放。**可以为空**——「还没跑过投放」的人要复盘的恰恰是那批
            还没投出去的素材分析，把执行设成必填等于把他们整个挡在提交那一步。
            空着不是含糊：报告详情会明写「没挂投放执行」。留空同样不会清掉报告原来挂着
            的那次执行（那是拿「没填」当「要删」）。
        expected_version:
          type: integer
          minimum: 1
          description: 防并发覆盖。两个人同时开着这份草稿，后提交的会把先提交的删改抹掉，而两边都不会看到提示。
    CreateReport:
      type: object
      additionalProperties: false
      required: [execution_id]
      properties:
        execution_id: { type: string }
        summary: { type: string }
        findings:
          type: array
          items: { type: string }
        window:
          allOf:
            - $ref: '#/components/schemas/ReportWindow'
          description: |
            要定格的数据窗口，来自投后分析页当前选的那一屏。省略时报告照旧生成，
            只是没有 `digest`。两端要么都给要么都不给：只给一端会被拒绝，
            因为后端补上另一端等于替人挑了半个窗口，而报告上会写得像是他自己选的。
    ReportWindow:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
    DropReportFinding:
      type: object
      additionalProperties: false
      required: [expected_version, index, dropped]
      properties:
        expected_version: { type: integer, minimum: 1 }
        index: { type: integer, minimum: 0 }
        dropped:
          type: boolean
          description: |
            true 是删掉，false 是撤销删掉。条目不会被物理移除——报告要能说清
            「系统给了什么、人拿掉了哪几条」。
    PinFinding:
      type: object
      additionalProperties: false
      description: |
        「记一笔」的入参。**不收** confidence / verdict：多带一个判定字段，
        页面上标的三档就成了装饰——前端改一个值就能把「算不出来」记成「能归因」。
      required: [window, dimension]
      properties:
        window:
          type: object
          additionalProperties: false
          required: [start, end]
          description: 人当时看的那个窗口，按天传。判定就是从这个窗口的分析结果里回查的。
          properties:
            start: { type: string, example: '2026-07-01' }
            end: { type: string, example: '2026-07-30' }
        dimension:
          type: string
          enum: [overview, comparisons, trends, fatigue, anomalies, drivers]
          description: 六个视图之一。记在别处，复盘页不知道该把它归到哪一块。
        source_ref:
          type: string
          description: 素材 ID 或异常日期。与 variable 至少给一个（overview 除外）。
        variable:
          type: string
          description: 特征键。与 source_ref 至少给一个（overview 除外）。
        text:
          type: string
          maxLength: 500
          description: 人自己补的一句话。留空则用系统给这一条的措辞。
    ReportFinding:
      type: object
      description: |
        报告里的一条发现。四块（素材表现 / 实验结论 / 相关经验 / 下一轮建议）
        按 `kind` 分组，顺序即 `ReportSectionKind` 的枚举顺序。
        `Judgement` 的字段（confidence / verdict / verdict_label / note，以及知道时才有的 threshold_version）平铺在这里。
      required: [kind, text, dropped, origin, confidence, verdict, verdict_label]
      properties:
        kind:
          type: string
          enum: [asset_performance, experiment, experience, recommendation]
        text: { type: string }
        origin:
          type: string
          enum: [system, pinned]
          description: |
            `pinned` 是人在分析页记的，`system` 是复盘时按规则补的。复盘页要把两者
            分开标（● 我记的 / ○ 系统补的）：混在一起，人就分不清哪几条是自己挑的。
            旧报告里没有这个字段，读出来时按 `system` 补齐。
        strength:
          allOf:
            - $ref: '#/components/schemas/VariantVerdict'
          description: 出自素材对比的发现才有。用来排序：可归因的排在方向性前面。
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string, description: '三档的中文名，后端给定，前端不得自行翻译。' }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。0 = 按出厂设定判的；**字段缺失表示不知道**（例如从库里按 confidence 重建出来的判定），此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note: { type: string, description: '一句话说明为什么是这个档位。' }
        dimension:
          type: string
          enum: [overview, comparisons, trends, fatigue, anomalies, drivers]
          description: 这条出自哪个视图。和 variable 一起构成去重键。
        variable:
          type: string
          description: 这条说的是哪个变量。和 dimension 一起构成去重键。
        source_ref:
          type: string
          description: 这条发现的来源 ID（素材、实验或经验），供前端跳回去核对。
        pinned_by:
          type: string
          description: 记这一笔的人。origin=pinned 才有。
        pinned_at:
          type: string
          format: date-time
          description: 记这一笔的时刻。origin=pinned 才有。
        dropped:
          type: boolean
          description: 被人工删掉的条目留在数组里，只是标记为 true。
    CreateExperience:
      type: object
      additionalProperties: false
      required: [expected_report_version, conclusion, conditions, counterexamples]
      properties:
        expected_report_version: { type: integer, minimum: 1 }
        conclusion: { type: string, maxLength: 2000 }
        conditions:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
        counterexamples:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
        card_type:
          allOf:
            - $ref: '#/components/schemas/InsightCardType'
          description: Defaults to hypothesis when omitted — the most conservative cell, so the API never claims more than the author did.
        confidence:
          allOf:
            - $ref: '#/components/schemas/ConfidenceLevel'
          description: Defaults to directional when omitted.
        recommended_action:
          type: string
          maxLength: 1000
          description: Required when card_type is recommendation.
        applicability:
          $ref: '#/components/schemas/Applicability'
        data_basis:
          allOf:
            - $ref: '#/components/schemas/DataBasis'
          description: Required when card_type is fact or statistic — those two are quotable as evidence.
        content_basis:
          $ref: '#/components/schemas/ContentBasis'
        source_finding:
          allOf:
            - $ref: '#/components/schemas/FindingRef'
          description: >-
            这条经验留的是这份报告里的哪一条发现。它是 Experience.threshold_version 唯一的
            合法来源：发现是系统按当时那一版阈值算出来的，号码是真的；人手敲的一句结论没有任何
            阈值参与，那种情况下不要传这一格。指的那条发现找不到（被删了、三格对不上）时不报错，
            按「没挑发现」处理——宁可空着，不猜。另填了一个与该发现不同的 confidence 时，
            档位听人的，但阈值印同样不盖：拿阈值给一个人工判断背书比不标更糟。
            指到一条 verdict = unclear（❓算不出来）的发现时整个请求返回 400：那一档连差异
            存不存在都没判出来，留成经验等于凭空造一个从来没算出来过的结论，而它在经验库里
            长得和真结论一模一样。先按它去找相似素材把样本做厚，重算成 explained 之后再留。
    FindingRef:
      type: object
      additionalProperties: false
      description: >-
        一条发现的身份：哪个维度上的哪个变量、出自哪个对象。三格与 ReportFinding 的
        dimension / variable / source_ref 一一对应，是前端点亮「记一笔」按钮用的同一把尺。
      properties:
        dimension: { type: string, maxLength: 100 }
        variable: { type: string, maxLength: 200 }
        source_ref: { type: string, maxLength: 200 }
    DeliveryExecutionSnapshot:
      type: object
      required: [id, change_set_id, plan_id, creative_package_id, mode, evidence_id, evidence_summary]
      properties:
        id: { type: string }
        change_set_id: { type: string }
        plan_id: { type: string }
        creative_package_id: { type: string }
        mode: { type: string, enum: [local_simulation] }
        evidence_id: { type: string }
        evidence_summary: { type: string }
        metric_snapshot:
          $ref: '#/components/schemas/DeliveryMetricSnapshot'
    DeliveryMetricSnapshot:
      type: object
      required: [id, source, is_simulated, dataset_version, currency, raw_metrics]
      properties:
        id: { type: string }
        source: { type: string, const: demo_fixture }
        is_simulated: { type: boolean, const: true }
        dataset_version: { type: string, const: preroll-demo/v1 }
        currency: { type: string, const: CNY }
        raw_metrics:
          type: object
          required: [impressions, clicks, conversions, spend_cents]
          properties:
            impressions: { type: integer, minimum: 0 }
            clicks: { type: integer, minimum: 0 }
            conversions: { type: integer, minimum: 0 }
            spend_cents: { type: integer, minimum: 0 }
    InsightReport:
      type: object
      required: [id, organization_id, project_id, execution_id, delivery_mode, evidence_id, evidence_summary, metric_snapshot_id, creative_package_id, is_simulated, dataset_version, status, summary, findings, version, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        execution_id: { type: string }
        delivery_mode: { type: string, enum: [local_simulation] }
        evidence_id: { type: string }
        evidence_summary: { type: string }
        metric_snapshot_id: { type: string }
        creative_package_id: { type: string }
        is_simulated: { type: boolean }
        dataset_version: { type: string }
        status: { type: string, enum: [draft, confirmed] }
        summary: { type: string }
        findings:
          type: array
          items: { type: string }
          description: 旧报告的读法，保留不动。新报告读 `digest`。
        digest:
          type: array
          items:
            $ref: '#/components/schemas/ReportFinding'
          description: 定格的四块发现。老报告为空数组。
        window_start:
          type: string
          format: date
          description: 定格的数据窗口起点。老报告没有窗口概念，此时为空——空比编一个进去诚实。
        window_end: { type: string, format: date }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        confirmed_by: { type: string }
        confirmed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExperienceStatus:
      type: string
      description: |
        Lifecycle of an organisational conclusion. A new conclusion starts as
        pending; only confirmed is quotable downstream; retired is a logical
        delete that keeps the row readable.

        「待复审」曾经是第四个状态，现在不是了：它是 confirmed 上的一个标记
        （见 Experience.needs_review）。做成状态会让一条被质疑的经验当场从所有
        下游消失——「有人觉得该重新看一眼」和「这条结论不成立」是两回事。
      enum: [pending, confirmed, retired]
    ReviseExperience:
      type: object
      additionalProperties: false
      required: [expected_version, conclusion, conditions, counterexamples]
      properties:
        expected_version: { type: integer, minimum: 1 }
        conclusion: { type: string, maxLength: 2000 }
        conditions:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
        counterexamples:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
        reason: { type: string, maxLength: 1000 }
        card_type:
          $ref: '#/components/schemas/InsightCardType'
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        recommended_action: { type: string, maxLength: 1000 }
        applicability:
          $ref: '#/components/schemas/Applicability'
        data_basis:
          $ref: '#/components/schemas/DataBasis'
        content_basis:
          $ref: '#/components/schemas/ContentBasis'
    RecordExperienceReference:
      type: object
      additionalProperties: false
      required: [consumer_kind, consumer_id, outcome]
      properties:
        consumer_kind: { type: string, minLength: 1, maxLength: 32 }
        consumer_id: { type: string, minLength: 1, maxLength: 96 }
        outcome:
          $ref: '#/components/schemas/ExperienceReferenceOutcome'
        note: { type: string, maxLength: 1000 }
    ExperienceReferenceOutcome:
      type: string
      description: How the downstream consumer treated the quoted conclusion.
      enum: [referenced, adopted, modified, rejected]
    Experience:
      type: object
      required: [id, organization_id, project_id, lineage_id, revision, report_id, source_execution_id, source_evidence_id, source_metric_snapshot_id, conclusion, card_type, confidence, verdict, verdict_label, note, recommended_action, conditions, counterexamples, applicability, data_basis, content_basis, status, needs_review, status_reason, status_changed_by, version, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        lineage_id: { type: string, description: Shared by every revision of one conclusion. }
        revision: { type: integer, minimum: 1 }
        supersedes_id: { type: string }
        superseded_by_id: { type: string }
        report_id: { type: string }
        source_execution_id: { type: string }
        source_evidence_id: { type: string }
        source_metric_snapshot_id: { type: string }
        conclusion: { type: string }
        card_type:
          $ref: '#/components/schemas/InsightCardType'
        # 以下几格是内嵌的 Judgement（见 schemas/Judgement），在 JSON 里平铺。
        # verdict / verdict_label / upgrade 不落库，每次读出来由后端唯一收敛点从
        # confidence 重算；threshold_version 例外——它是历史事实（当初判这一档时生效的
        # 那一版号码），重算不出来，所以单独落一列。
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。只有当这条经验留的是复盘里某一条系统算出来的发现、且人没有另填档位时才有；人手填的档位一律缺失。0 = 按出厂设定判的；**字段缺失表示不知道**，此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note: { type: string }
        recommended_action: { type: string }
        conditions:
          type: array
          items: { type: string }
        counterexamples:
          type: array
          items: { type: string }
        applicability:
          $ref: '#/components/schemas/Applicability'
        data_basis:
          $ref: '#/components/schemas/DataBasis'
        content_basis:
          $ref: '#/components/schemas/ContentBasis'
        status:
          $ref: '#/components/schemas/ExperienceStatus'
        needs_review:
          type: boolean
          description: >
            「该看一眼了」。不影响这条经验能不能用，只是提醒有人重新看一遍依据。
            被标记的经验仍然是 confirmed，仍然出现在下游默认引用集里。
        status_reason: { type: string }
        status_changed_by: { type: string }
        status_changed_at: { type: string, format: date-time }
        confirmed_by: { type: string }
        confirmed_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExperienceLookup:
      type: object
      additionalProperties: false
      description: |
        「查」的条件。每一格空着表示不限。

        匹配规则：经验没声明某一格适用条件 = 该格不限，能对上任何取值；声明了就
        必须对上。反过来做（没声明就不匹配）会把绝大多数经验筛没——大部分经验只
        写了两三格适用条件，而查的人会把当前项目的几格全填上。

        适用条件每一格在经验那边是一组值（一条经验可以同时适用于抖音和小红书），
        所以命中的判断是「查的这个值在那一组里」，不是相等。
      properties:
        brand: { type: string, maxLength: 200 }
        product: { type: string, maxLength: 200 }
        channel: { type: string, maxLength: 200 }
        ad_type:
          type: string
          maxLength: 200
          description: 对应经验适用条件里的 creative_types。
        objective: { type: string, maxLength: 200 }
        audience: { type: string, maxLength: 200 }
        feature:
          type: string
          maxLength: 200
          description: >
            按内容特征找：「有没有关于开场的经验」。子串匹配，结论、建议动作、
            内容依据里的特征三处都搜——问的人想不起来那条经验当初写在了哪一栏。
        include_observed:
          type: boolean
          description: >
            打开之后连「👁 只是观察」的也给，默认关着。查的人多数时候要的是能照着
            做的东西，混进观察会让他分不清哪条能信。给出来的观察项 default 为 false。
        limit: { type: integer, minimum: 1, maximum: 100 }
    ExperienceMatch:
      type: object
      required: [experience, matched, default, citation_text]
      properties:
        experience:
          $ref: '#/components/schemas/Experience'
        matched:
          type: array
          description: >
            凭哪几格推给你（品牌 / 产品 / 渠道 / 广告类型 / 目标 / 受众 / 内容特征）。
            人看到一条经验被推荐，第一个问题就是「凭什么」。只列真正卡住的格子——
            经验没声明、或者查的人没填的格子不算。
          items: { type: string }
        default:
          type: boolean
          description: >
            能不能直接照着做。两道闸都过（状态在用 + 判定 ✅ 能归因）才是 true；
            只是观察的经验即使被查出来，也标 false。
        citation_text:
          type: string
          description: >
            把这条经验抄到别处时的完整说法：结论 + 适用条件 + 来源复盘，只是观察的
            还会带上那句提醒。由服务端拼好发出来，调用方不要自己再拼一遍——拼法有
            两处，界面上看到的适用范围和抄出去的那句话迟早对不上。
    ExperienceAudit:
      type: object
      required: [id, organization_id, project_id, experience_id, from_status, to_status, reason, actor_id, created_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        experience_id: { type: string }
        from_status: { type: string, description: Empty when the experience was first deposited. }
        to_status:
          $ref: '#/components/schemas/ExperienceStatus'
        reason: { type: string }
        actor_id: { type: string }
        created_at: { type: string, format: date-time }
    ExperienceReference:
      type: object
      required: [id, organization_id, project_id, experience_id, consumer_kind, consumer_id, outcome, note, version, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        experience_id: { type: string }
        consumer_kind: { type: string }
        consumer_id: { type: string }
        outcome:
          $ref: '#/components/schemas/ExperienceReferenceOutcome'
        note: { type: string }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InsightCardType:
      type: string
      description: |
        Fact / statistical observation / hypothesis / recommendation. This is
        the boundary PRD 03 §2 目标⑥ asks the module to hold: a correlation is
        not a cause, and a human conclusion is not a measurement.
      enum: [fact, statistic, hypothesis, recommendation]
    Applicability:
      type: object
      description: |
        The filterable half of 适用范围. The free-text half stays in conditions:
        one is used to narrow the list, the other to explain it to a human.
      properties:
        brands: { type: array, maxItems: 20, items: { type: string, maxLength: 96 } }
        products: { type: array, maxItems: 20, items: { type: string, maxLength: 96 } }
        channels: { type: array, maxItems: 20, items: { type: string, maxLength: 96 } }
        creative_types: { type: array, maxItems: 20, items: { type: string, maxLength: 96 } }
        objectives: { type: array, maxItems: 20, items: { type: string, maxLength: 96 } }
        audiences: { type: array, maxItems: 20, items: { type: string, maxLength: 96 } }
        time_range_note: { type: string, maxLength: 200 }
    DataBasis:
      type: object
      description: The quantitative half of 数据依据.
      properties:
        asset_count: { type: integer, minimum: 0 }
        sample_size: { type: integer, minimum: 0 }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        metrics: { type: array, maxItems: 20, items: { type: string, maxLength: 96 } }
        baseline: { type: string, maxLength: 200 }
    ContentBasis:
      type: object
      description: 内容依据 — which creative features the conclusion rests on.
      properties:
        features: { type: array, maxItems: 30, items: { type: string, maxLength: 96 } }
        example_asset_versions: { type: array, maxItems: 20, items: { type: string, maxLength: 96 } }
        note: { type: string, maxLength: 1000 }
    InsightCard:
      type: object
      description: |
        The 洞察卡 projection of one confirmed experience (PRD 03 §8.1). All nine
        fields are carried; missing_fields names the ones the author never filled
        in, because hiding an incomplete card reads as "the library is empty".
      required: [experience_id, lineage_id, revision, conclusion, type, type_label, applicability, conditions, data_basis, content_basis, confidence, confidence_hint, counterexamples, recommended_action, status, missing_fields, reference_count, updated_at]
      properties:
        experience_id: { type: string }
        lineage_id: { type: string }
        revision: { type: integer, minimum: 1 }
        conclusion: { type: string }
        type:
          $ref: '#/components/schemas/InsightCardType'
        type_label: { type: string }
        applicability:
          $ref: '#/components/schemas/Applicability'
        conditions: { type: array, items: { type: string } }
        data_basis:
          $ref: '#/components/schemas/DataBasis'
        content_basis:
          $ref: '#/components/schemas/ContentBasis'
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        confidence_hint: { type: string }
        threshold_version: { type: integer, format: int64, description: '跟着经验投影过来的阈值版本，口径与 Experience.threshold_version 相同。**字段缺失表示不知道**，此时前端不得显示任何阈值标注——这一页是拿经验去指导下一轮投放的地方，替一条来历不明的结论盖印比不盖更糟。' }
        counterexamples: { type: array, items: { type: string } }
        recommended_action: { type: string }
        status:
          $ref: '#/components/schemas/ExperienceStatus'
        missing_fields: { type: array, items: { type: string } }
        reference_count: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    FeaturePattern:
      type: object
      description: |
        How often one creative feature shows up across confirmed conclusions.
        Deliberately a count, not a ranking — appearing often can just mean it
        was tried often.
      required: [feature, label, governed, card_count, channels, best_confidence, conclusions, repeated]
      properties:
        feature: { type: string, description: '分桶键。入表的是特征体系里的字段键（hook_type），没入表的是原样文本。不要显示给人看，显示用 label。' }
        label: { type: string, description: '人话名。入表的取字段中文名（hook_type → 钩子类型），没入表的原样显示。' }
        governed: { type: boolean, description: '这个名字有没有落在特征体系里（03 §5 末：受控词表由管理员维护，避免同义词碎片化）。false 的不算「反复」——名字没入表，就没人担保同义写法已经合成一个桶。' }
        repeated: { type: boolean, description: '够不够得上「反复」：governed 且至少被两条结论提到。整屏标题写着「反复有效」，不设门槛的话每条都是「1 条结论提到」。' }
        card_count: { type: integer, minimum: 1 }
        channels: { type: array, items: { type: string } }
        best_confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        conclusions: { type: array, items: { type: string } }
    PreLaunchInsight:
      type: object
      required: [project_id, cards, patterns, facets, unscoped_excluded, mixed_channels, cross_channel_comparison, quality_checked, strong_conclusions_allowed, experience_references, disclosure]
      properties:
        project_id: { type: string }
        cards:
          type: array
          items:
            $ref: '#/components/schemas/InsightCard'
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/FeaturePattern'
        facets:
          type: object
          description: Values actually present in this Project's confirmed experience, for building filters.
          required: [channels, creative_types, objectives]
          properties:
            channels: { type: array, items: { type: string } }
            creative_types: { type: array, items: { type: string } }
            objectives: { type: array, items: { type: string } }
        unscoped_excluded:
          type: integer
          minimum: 0
          description: Confirmed experiences hidden by the filter because they never declared an applicability scope.
        mixed_channels:
          type: array
          items: { type: string }
          description: Channels spanned by the returned cards. More than one means side-by-side comparison is not safe.
        cross_channel_comparison: { type: boolean }
        quality_checked:
          type: boolean
          description: False when the data-quality gate could not be evaluated; the UI must say "unknown" rather than imply a pass.
        strong_conclusions_allowed:
          type: boolean
          description: False when a blocking data-quality issue is open (PRD 03 §10.3③).
        quality_blockers:
          type: array
          items: { type: string }
        experience_references:
          type: array
          items:
            $ref: '#/components/schemas/Experience'
        disclosure: { type: string }
    PerformanceOverview:
      type: object
      required: [project_id, executions, disclosure]
      properties:
        project_id: { type: string }
        executions:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryExecutionSnapshot'
        disclosure: { type: string }
    Problem:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable, details]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            retryable: { type: boolean }
            details:
              type: array
              items: { type: object }
    AnalysisStatus:
      type: string
      description: |
        分析状态链 (03 §11.1): 待数据 → 待匹配 → 可分析 → 分析中 → 待确认 →
        已确认 / 待复审 / 已失效. retired is a logical delete — the row stays
        readable so anything that quoted it remains auditable.
      enum: [awaiting_data, awaiting_match, analysable, analysing, pending_confirmation, confirmed, needs_review, retired]
    AssetType:
      type: string
      description: |
        The six identifiable content types of AM-004. Each carries its own
        feature system, which is why a type may not be changed once features
        exist: the old system's values would be orphaned.
      enum: [xiaohongshu_note, wechat_article, brand_ad, digital_human_ad, preroll_ad, hit_replica_ad]
    AssetSourceKind:
      type: string
      description: >-
        Where an indexed asset came from (AM-001). `external` means reference
        evidence from outside the platform — competitor material that is never
        run as an ad. `miyun` assets come from the Miyun pipeline and do go
        live, so they are attributed like any other creative; the two used to
        share the `external` label and reading it was a coin toss.
      enum: [creative, upload, external, miyun]
    AssetRole:
      type: string
      description: >-
        What an asset is here for, independent of how far its analysis got.
        `ledger` assets are on the books only: they never enter the analysis
        queues and carry no features. `analysis` assets are the ones actually
        going live, so they get matched, extracted and attributed.
      enum: [ledger, analysis]
    FeatureSource:
      type: string
      description: >-
        The data layers 03 §14 keeps apart. An AI inference and a human
        conclusion for the same key are separate rows; neither overwrites the
        other, so re-running extraction cannot erase a person's decision.


        三类的可信度不是一回事：derived 客观可测（从文件本身算出来的时长、分辨率、
        镜头数，同一个文件算两遍结果一样）、human 人工标注（人会错，但人为自己填的
        东西负责）、ai 模型推断（模型看着素材猜的）。只有前两类能进归因结论；
        ai 行一旦被人复核认可（review_state=confirmed），从此按 human 算——
        有人为它背书了。
      enum: [ai, human, derived]
    Confidence:
      type: string
      description: Required on the AI layer, forbidden on the human layer (03 §5 末).
      enum: [low, medium, high]
    ReviewState:
      type: string
      description: >-
        On an AI row this stays pending — the review is recorded by the human
        row that appears beside it. On that human row, confirmed 表示认可 AI 的
        判断，rejected 表示推翻它并给出自己的取值.
      enum: [pending, confirmed, rejected]
    MappingStatus:
      type: string
      description: unmatched is the 待匹配 queue; ignored is a deliberate set-aside (AM-003).
      enum: [unmatched, matched, ignored]
    FeatureValueKind:
      type: string
      description: >-
        Decides which member of FeatureValue is meaningful, and must equal the
        kind the asset type's schema declares for the key — that is what keeps
        a 时长 from being stored as free text.
      enum: [text, tags, enum, enum_multi, number, bool, duration_seconds]
    FeatureValue:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/FeatureValueKind'
        text: { type: string, maxLength: 2000 }
        terms:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 100 }
        number: { type: number }
        bool: { type: boolean }
    FeatureInput:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key: { type: string, minLength: 1 }
        value:
          $ref: '#/components/schemas/FeatureValue'
        confidence:
          $ref: '#/components/schemas/Confidence'
        review_state:
          $ref: '#/components/schemas/ReviewState'
    InsightAsset:
      type: object
      required: [id, organization_id, project_id, role, lineage_id, revision, title, source_kind, analysis_status, version, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        role:
          $ref: '#/components/schemas/AssetRole'
        lineage_id:
          type: string
          description: Stable identity of one creative across its revisions (AM-001).
        revision: { type: integer, minimum: 1 }
        title: { type: string }
        source_kind:
          $ref: '#/components/schemas/AssetSourceKind'
        source_ref: { type: string }
        source_job_id: { type: string }
        platform_asset_id: { type: string }
        platform_asset_version: { type: integer }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        asset_type_source:
          $ref: '#/components/schemas/FeatureSource'
        asset_type_confidence:
          $ref: '#/components/schemas/Confidence'
        analysis_status:
          $ref: '#/components/schemas/AnalysisStatus'
        analysis_status_reason: { type: string }
        analysis_status_changed_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetMapping:
      type: object
      required: [id, organization_id, project_id, platform, platform_object_kind, platform_object_id, status, version, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        platform: { type: string }
        platform_object_kind: { type: string, enum: [creative, ad] }
        platform_object_id: { type: string }
        platform_object_name: { type: string }
        asset_id: { type: string }
        status:
          $ref: '#/components/schemas/MappingStatus'
        match_source: { type: string, enum: [auto, human] }
        matched_by: { type: string }
        matched_at: { type: string, format: date-time }
        note: { type: string }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssetFeature:
      type: object
      required: [id, organization_id, project_id, asset_id, asset_type, key, value, source, review_state, version, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        asset_id: { type: string }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        key: { type: string }
        value:
          $ref: '#/components/schemas/FeatureValue'
        source:
          $ref: '#/components/schemas/FeatureSource'
        confidence:
          $ref: '#/components/schemas/Confidence'
        review_state:
          $ref: '#/components/schemas/ReviewState'
        skill_id: { type: string }
        skill_version: { type: string }
        extracted_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FeatureField:
      type: object
      required: [key, label, group, kind]
      properties:
        key: { type: string }
        label: { type: string }
        group:
          type: string
          description: PRD sub-heading this field came from; the UI renders a section per group.
        kind:
          $ref: '#/components/schemas/FeatureValueKind'
        vocabulary:
          type: array
          description: >-
            An empty list on an enum field is deliberate: vocabulary maintenance
            belongs to 能力运营 → 特征体系 (03 §5 末), so the field ships open and
            off-vocabulary terms are only rejected once a list exists.
          items: { type: string }
        unit: { type: string }
        note: { type: string }
    FeatureSchema:
      type: object
      required: [asset_type, label, source, fields]
      properties:
        asset_type:
          $ref: '#/components/schemas/AssetType'
        label: { type: string }
        source:
          type: string
          description: The PRD section this feature system was transcribed from.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FeatureField'
    FeatureMatrixCell:
      type: object
      required: [asset_id, source, review_state, value]
      properties:
        asset_id: { type: string }
        source:
          $ref: '#/components/schemas/FeatureSource'
        confidence:
          $ref: '#/components/schemas/Confidence'
        review_state:
          $ref: '#/components/schemas/ReviewState'
        value:
          $ref: '#/components/schemas/FeatureValue'
    FeatureMatrixRow:
      type: object
      required: [key, label, group, kind, cells]
      properties:
        key: { type: string }
        label: { type: string }
        group: { type: string }
        kind:
          $ref: '#/components/schemas/FeatureValueKind'
        cells:
          type: array
          items:
            $ref: '#/components/schemas/FeatureMatrixCell'
    FeatureMatrix:
      type: object
      required: [assets, asset_types, rows, disclosure]
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/InsightAsset'
        asset_types:
          type: array
          items:
            $ref: '#/components/schemas/AssetType'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/FeatureMatrixRow'
        disclosure:
          type: string
          description: >-
            States which keys were compared and why others were left out, so a
            mixed-type comparison never looks more complete than it is.
    SimilarAssetRequest:
      type: object
      additionalProperties: false
      description: >-
        At least one of `asset_id` or `features` is required; supplying neither
        would list the whole library, which is the asset list, not a similarity
        search. When both are given the explicit `features` win — that is what
        the person actually asked about.
      properties:
        asset_id: { type: string }
        features:
          type: object
          maxProperties: 20
          additionalProperties: { type: string }
          description: >-
            Variable key to value. More than 20 degenerates into "find that one
            asset again".
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
    SimilarityReason:
      type: object
      required: [key, label, value, source]
      description: >-
        One statement of *where* two assets are similar. Without this a hit is
        just a number, and the assets behind it cannot be grouped for attribution.
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: string }
        source:
          $ref: '#/components/schemas/FeatureSource'
    SimilarAsset:
      type: object
      required: [asset_id, title, overlap, admissible_overlap, score, reasons]
      properties:
        asset_id: { type: string }
        title: { type: string }
        overlap:
          type: integer
          description: How many probe variables matched.
        admissible_overlap:
          type: integer
          description: >-
            How many of those may enter attribution (`derived`/`human` only).
            Overlap answers "is it alike"; this answers "can I actually conclude
            anything after pulling it in".
        score:
          type: number
          format: double
          description: Matched variables over probe size, for display only.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/SimilarityReason'
    SimilarAssetResult:
      type: object
      required: [probe, items, note]
      properties:
        probe:
          type: array
          description: >-
            The variables the search actually ran on. Returned so a person can
            see why an odd-looking result set came back.
          items:
            $ref: '#/components/schemas/SimilarityReason'
        items:
          type: array
          items:
            $ref: '#/components/schemas/SimilarAsset'
        note:
          type: string
          description: >-
            Empty when the results stand on their own. Non-empty when the caller
            must be told something: nothing was found, the asset has no usable
            variables yet, or every match rests solely on model inference and so
            may be looked at but not used for attribution.
    ImportExternalAssetRequest:
      type: object
      additionalProperties: false
      required: [title, purpose, window_end]
      properties:
        title:
          type: string
          maxLength: 255
          description: >-
            Required. Without it the list is a wall of untitled rows and nobody
            can tell which piece of evidence is which.
        source_note:
          type: string
          maxLength: 512
          description: >-
            Where this came from, in the importer's own words. Deliberately not a
            dropdown: sources vary too widely, and forcing a list only makes
            everyone pick "other", which turns the column into dead weight.
        asset_type:
          type: string
        purpose:
          type: string
          enum: [benchmark, reference]
          description: >-
            Required. Not a category label — a record. When someone later asks
            "why are we still holding this file", this column is the answer.
            `benchmark` = a yardstick for "what does this kind of asset usually
            achieve"; `reference` = a positive or negative example backing one of
            this round's conclusions.
        purpose_note:
          type: string
          maxLength: 512
        window_end:
          type: string
          format: date
          description: >-
            End date of the review window this asset explains. Retention counts
            from here.
        features:
          type: object
          additionalProperties: { type: string }
          description: >-
            Variables a person tagged on it. Stored as free text and never used
            for attribution or similarity search — this is evidence, not a
            comparable asset.
        file_ext:
          type: string
          description: Used only to build the storage path.
    ExternalAsset:
      type: object
      required: [id, title, purpose, original_purged, features, retention_until]
      description: >-
        One piece of off-platform evidence. **No version, no lineage, no status
        machine** — those belong to assets. It is read-only.
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        title: { type: string }
        source_note: { type: string }
        asset_type: { type: string }
        purpose:
          type: string
          enum: [benchmark, reference]
        purpose_note: { type: string }
        storage_key:
          type: string
          description: >-
            Always under the `insights/external/` prefix, physically separate
            from platform assets. Empty once the original has been purged.
        original_purged:
          type: boolean
          description: >-
            True once the retention deadline passed and the original file was
            deleted. The row and its features survive — a review that cited this
            asset must still say what was seen at the time.
        features:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FeatureValue'
        retention_until:
          type: string
          format: date-time
          description: >-
            Computed at import from `window_end` + 90 days and stored, not
            recomputed on read: recomputing would move every historical
            deadline the moment the constant changes, while people acted on the
            deadline they were told at import time.
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    IndexAsset:
      type: object
      additionalProperties: false
      required: [title, source_kind]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        source_kind:
          $ref: '#/components/schemas/AssetSourceKind'
        role:
          allOf:
            - $ref: '#/components/schemas/AssetRole'
          description: >-
            Defaults to `analysis` — anything registered by hand is meant to go
            live. Only the platform's own ledger intake passes `ledger`.
        source_ref: { type: string, maxLength: 512 }
        source_job_id: { type: string }
        lineage_id:
          type: string
          maxLength: 96
          description: Empty starts a new lineage; a known one appends a revision.
        platform_asset_id:
          type: string
          description: Give this together with platform_asset_version, or give neither.
        platform_asset_version: { type: integer }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        asset_type_source:
          $ref: '#/components/schemas/FeatureSource'
        asset_type_confidence:
          $ref: '#/components/schemas/Confidence'
    IdentifyAssetType:
      type: object
      additionalProperties: false
      required: [expected_version, asset_type, source]
      properties:
        expected_version: { type: integer, minimum: 1 }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        source:
          $ref: '#/components/schemas/FeatureSource'
        confidence:
          $ref: '#/components/schemas/Confidence'
        reason: { type: string, maxLength: 1000 }
    ExtractFeatures:
      type: object
      additionalProperties: false
      required: [expected_version, skill_id, features]
      properties:
        expected_version: { type: integer, minimum: 1 }
        skill_id: { type: string, minLength: 1 }
        skill_version: { type: string }
        features:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FeatureInput'
          description: >-
            Every key must belong to this asset's own feature system; a video
            hook field on a WeChat article is rejected (03 §15②). Every entry
            must carry a confidence.
    PatchFeatures:
      type: object
      additionalProperties: false
      required: [expected_version, features]
      properties:
        expected_version: { type: integer, minimum: 1 }
        features:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FeatureInput'
          description: >-
            Writes the human layer only. Entries must not carry a confidence —
            a person's conclusion has no machine confidence.
        reason: { type: string, maxLength: 1000 }
    AnalyzeAsset:
      type: object
      additionalProperties: false
      required: [expected_version, content]
      properties:
        expected_version: { type: integer, minimum: 1 }
        content:
          type: string
          minLength: 1
          maxLength: 20000
          description: >-
            The text to analyse: the article body for written assets, the script
            or shot description for video. Required, and supplied by the caller —
            the asset library stores identity and state, not the asset body. The
            cap is about cost and explainability, not performance: over very long
            inputs a model reports what the piece mentions rather than what it is.
        note:
          type: string
          maxLength: 1000
          description: Human context, e.g. "this is the vertical recut, same footage as A".
    AnalyzeAssetResult:
      type: object
      required: [run, features]
      properties:
        run:
          $ref: '#/components/schemas/AnalysisRun'
        features:
          type: array
          items:
            $ref: '#/components/schemas/AssetFeature'
          description: Every feature of the asset after the run, both layers.
        dropped_fields:
          type: array
          items: { type: string }
          description: >-
            Answers that were discarded, one human-readable reason each. Always
            surface these: a few missing features look like "the model didn't see
            it", while the real cause may be a format mismatch — that is a bug to
            fix, not a model limitation.
    AnalysisRun:
      type: object
      description: >-
        One analysis task, append-only. Records the input, the method, the Skill
        version, the result and the error (03 §113/§304/§344 acceptance 12).
        The input's full text is deliberately absent — only its hash and shape are
        kept (09 §7).
      required: [id, kind, asset_id, status, asset_type, started_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        kind: { type: string, enum: [feature_extraction] }
        asset_id: { type: string }
        status: { type: string, enum: [running, succeeded, failed] }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        skill_id: { type: string }
        skill_version: { type: string }
        skill_content_hash: { type: string }
        prompt_version: { type: string }
        provider_code: { type: string }
        model_alias:
          type: string
          description: A capability alias, never a vendor model ID (10 §凭据只存引用).
        model_version: { type: string }
        route_revision_id: { type: string }
        response_mode: { type: string }
        generation_mode: { type: string, enum: [model, template] }
        input_hash: { type: string }
        input_summary:
          type: object
          description: Shape of the input only — character counts and field counts, no text.
        result_hash: { type: string }
        feature_count: { type: integer }
        dropped_fields:
          type: array
          items: { type: string }
        data_through:
          type: string
          format: date-time
          description: Data cut-off. Absent for content-only runs, which read no metrics.
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        latency_ms: { type: integer }
        error_code: { type: string }
        error_message: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RegisterAssetMapping:
      type: object
      additionalProperties: false
      required: [platform, platform_object_kind, platform_object_id]
      properties:
        platform: { type: string, minLength: 1, maxLength: 32 }
        platform_object_kind: { type: string, enum: [creative, ad] }
        platform_object_id: { type: string, minLength: 1, maxLength: 191 }
        platform_object_name: { type: string, maxLength: 255 }
        asset_id:
          type: string
          description: Omit to file the object in the 待匹配 queue.
        match_source:
          type: string
          enum: [auto, human]
          description: Required whenever asset_id is given.
        note: { type: string, maxLength: 1000 }
    ResolveAssetMapping:
      type: object
      additionalProperties: false
      required: [expected_version, status]
      properties:
        expected_version: { type: integer, minimum: 1 }
        status:
          $ref: '#/components/schemas/MappingStatus'
        asset_id:
          type: string
          description: >-
            Required when status is matched, and must be empty otherwise — an
            unmatched or ignored row may not keep a stale asset pointer.
        note:
          type: string
          maxLength: 1000
          description: Required when status is ignored.
    Platform:
      type: string
      description: 首期覆盖的投放平台 (doc10 §1).
      enum: [douyin, kuaishou, xiaohongshu, wechat, tencent_ads, other]
    IngestMode:
      type: string
      description: |
        接入方式 (doc10 §2)，按可靠性排序：官方 API 优先，页面读取只作受控补充。
      enum: [api, service_account, file_import, computer_use, business]
    DataSourceStatus:
      type: string
      description: >-
        draft 未启用 / active 同步中 / paused 已暂停 / revoked 已撤销授权。数据源
        在字段映射填好之前不能离开 draft。
      enum: [draft, active, paused, revoked]
    QualityStatus:
      type: string
      description: |
        数据质量状态 (doc10 §11)。除 healthy 外的任何取值都必须带 quality_note，
        并且按 §12.4 会阻止该数据源的数字生成强洞察或自动优化动作。
      enum: [healthy, delayed, partial, mapping_incomplete, tracking_broken, reconciling, blocked]
    ImportKind:
      type: string
      description: >-
        sync 增量同步 / backfill 历史回补 / file 文件导入 / correction 更正批次。
        更正批次是重复哈希被拦下后唯一被认可的重导方式 (doc10 §8)。
      enum: [sync, backfill, file, correction]
    ImportStatus:
      type: string
      description: partial 表示部分行被拒但其余已入库，被拒原因在 errors 里。
      enum: [pending, running, succeeded, partial, failed]
    ConfidenceLevel:
      type: string
      description: |
        置信提示 (03 §9)：sufficient 充分 / directional 方向性 /
        low_sample 样本不足 / confounded 存在混杂。刻意不是数字——PRD 要的是
        一个非分析师也能读懂的定性提示。
      enum: [sufficient, directional, low_sample, confounded]
    Verdict:
      type: string
      description: |
        三档结论：explained 能归因 / observed 只是观察 / unclear 算不出来。
        由 ConfidenceLevel 四档收敛而来（sufficient→explained，directional 与
        confounded→observed，low_sample→unclear），收敛规则在全模块只有一处实现，
        见 internal/systems/insights/verdict.go 的 ConfidenceLevel.Verdict()。
        置信四档说的是「数据有多硬」，三档说的是「你现在能拿它干什么」——前者留给
        分析口径，后者是屏幕上给人看的那个。
      enum: [explained, observed, unclear]
    UpgradePath:
      type: string
      description: |
        这一档要往上走该做什么：observed 缺的是对照，去做个实验；unclear 缺的是
        样本，去库里找相似素材把样本做厚。explained 已经到顶，不带这个字段。
        每一条「说不清」都必须配一条出路，否则用户只能干瞪眼。
      enum: [experiment, similar_assets]
    Judgement:
      type: object
      description: |
        一条判定的完整口径。除 PerformanceAnalysis.judgement 这个屏幕级汇总之外，
        其余用到它的地方都是内嵌（Go embedded struct），四个字段在 JSON 里平铺在
        宿主对象上，而不是套一层 judgement。
      required: [confidence, verdict, verdict_label, note]
      properties:
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string, description: '三档的中文名，后端给定，前端不得自行翻译。' }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。0 = 按出厂设定判的；**字段缺失表示不知道**（例如从库里按 confidence 重建出来的判定），此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note: { type: string, description: '一句话说明为什么是这个档位。' }
    MetricCaliber:
      type: object
      description: >-
        口径 (doc10 §6)：两个数字可以并排放之前必须一致的东西。任一项不同，总览
        就会把 comparable 置为 false 并写明原因，而不是让前端自己判断。
      required: [time_zone, currency, attribution_window, metric_schema_version]
      properties:
        time_zone: { type: string, description: 'IANA 时区，默认 Asia/Shanghai' }
        currency: { type: string, minLength: 3, maxLength: 3, description: 'ISO 三位币种代码' }
        attribution_window: { type: string, description: '归因窗口，未指定时为 platform_default' }
        metric_schema_version: { type: string }
    MetricCounts:
      type: object
      description: >-
        Canonical 原始计数，全部为整数。金额一律以「分」为单位存整数，避免浮点在
        汇总时漂移。
      required: [impressions, clicks, conversions, video_views, video_completions, spend_cents, revenue_cents]
      properties:
        impressions: { type: integer, minimum: 0 }
        clicks: { type: integer, minimum: 0 }
        conversions: { type: integer, minimum: 0 }
        video_views: { type: integer, minimum: 0 }
        video_completions: { type: integer, minimum: 0 }
        spend_cents: { type: integer, minimum: 0 }
        revenue_cents: { type: integer, minimum: 0 }
    MetricRates:
      type: object
      description: |
        派生指标 (doc10 §6)。**字段缺失表示「不可用」，不是 0**——分母为零时本 API
        不返回该字段，前端必须显示「不可用」，不得把它当成 0 参与排序或比较。
        因此这里没有任何 required 字段。
      properties:
        ctr: { type: number, description: '点击 / 曝光；曝光为 0 时缺失' }
        cvr: { type: number, description: '转化 / 点击；点击为 0 时缺失' }
        completion_rate: { type: number, description: '完播 / 播放；播放为 0 时缺失' }
        cpa_cents: { type: number, description: '花费 / 转化（分）；转化为 0 时缺失' }
        cpm_cents: { type: number, description: '千次曝光花费（分）；曝光为 0 时缺失' }
        roas: { type: number, description: '收入 / 花费；花费为 0 时缺失' }
    RateInterval:
      type: object
      description: >-
        比率的置信区间（Wilson 区间）。20 §4.1 要求置信范围与图表同屏：样本越小
        区间越宽，读者才看得出「这个差异可能只是噪声」。
      required: [low, high]
      properties:
        low: { type: number }
        high: { type: number }
    MetricWindow:
      type: object
      description: 数据窗口，两端都含。总览始终原样回显它。
      required: [start, end]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    DataSource:
      type: object
      description: >-
        doc10 §3 DataSource + Connection，去掉一切机密：credential_ref 是密钥服务
        的引用键，凭据本身永不落业务库 (§9)。
      required: [id, organization_id, project_id, platform, ingest_mode, status, quality_status, caliber, version, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        platform:
          $ref: '#/components/schemas/Platform'
        account_label: { type: string }
        account_ref: { type: string, description: '平台账户标识；同一项目下同平台同账户只能接入一次' }
        ingest_mode:
          $ref: '#/components/schemas/IngestMode'
        credential_ref: { type: string, description: '密钥服务里的引用键，不是凭据本身' }
        status:
          $ref: '#/components/schemas/DataSourceStatus'
        quality_status:
          $ref: '#/components/schemas/QualityStatus'
        quality_note: { type: string }
        caliber:
          $ref: '#/components/schemas/MetricCaliber'
        field_mapping:
          type: object
          additionalProperties: { type: string }
          description: 平台报表列名 → canonical 指标名 (doc10 §8)。为空时不允许导入。
        data_through: { type: string, format: date-time, description: '已覆盖到的数据日期；历史回补不会把它拉回去' }
        last_synced_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImportBatch:
      type: object
      description: 一次同步、一个文件、一次回补或一次更正，带 doc10 §7 要求每批记录的计数。
      required: [id, organization_id, project_id, data_source_id, kind, status, requested_rows, accepted_rows, rejected_rows, version, created_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        data_source_id: { type: string }
        kind:
          $ref: '#/components/schemas/ImportKind'
        status:
          $ref: '#/components/schemas/ImportStatus'
        source_label: { type: string }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        content_hash: { type: string, description: '相同哈希 + 相同导入范围默认阻止重复导入 (doc10 §8)' }
        requested_rows: { type: integer, minimum: 0 }
        accepted_rows: { type: integer, minimum: 0 }
        rejected_rows: { type: integer, minimum: 0 }
        error_summary: { type: string }
        errors:
          type: array
          items: { type: string }
          description: 逐行拒绝原因，形如「第 2 行：…」，供前端定位问题行。
        corrects_batch_id: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImportResult:
      type: object
      required: [batch, new_mappings]
      properties:
        batch:
          $ref: '#/components/schemas/ImportBatch'
        new_mappings:
          type: integer
          minimum: 0
          description: 本批次新登记进 待匹配 队列的平台对象数（register_objects 为 true 时）。
    AssetPerformance:
      type: object
      description: >-
        素材矩阵的一行。asset_id 为空表示这一行是未匹配对象的汇总——它的花费照样
        计入总盘，但 attributable 为 false，不能承载创意级结论 (doc10 §5)。
      required: [asset_title, objects, counts, rates, attributable, confidence, verdict, verdict_label]
      properties:
        asset_id: { type: string }
        asset_title: { type: string }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        objects: { type: integer, minimum: 0, description: '归入这一行的平台对象数' }
        counts:
          $ref: '#/components/schemas/MetricCounts'
        rates:
          $ref: '#/components/schemas/MetricRates'
        attributable: { type: boolean }
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。0 = 按出厂设定判的；**字段缺失表示不知道**（例如从库里按 confidence 重建出来的判定），此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note: { type: string, description: '一句话说明为什么是这个档位。' }
    PerformancePoint:
      type: object
      required: [date, counts, rates]
      properties:
        date: { type: string, format: date }
        counts:
          $ref: '#/components/schemas/MetricCounts'
        rates:
          $ref: '#/components/schemas/MetricRates'
    PlatformTotal:
      type: object
      required: [platform, label, counts, rates]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        label: { type: string, description: '平台中文名，直接可显示' }
        counts:
          $ref: '#/components/schemas/MetricCounts'
        rates:
          $ref: '#/components/schemas/MetricRates'
    SourceHealth:
      type: object
      description: 每个参与本窗口的数据源的新鲜度与质量，必须与图表同屏 (doc10 §11)。
      required: [data_source_id, platform, label, status, freshness_judged, quality_status, freshness_days]
      properties:
        data_source_id: { type: string }
        platform:
          $ref: '#/components/schemas/Platform'
        label: { type: string }
        status:
          allOf:
            - $ref: '#/components/schemas/DataSourceStatus'
          description: |
            生命周期状态（通路开着没有）。和 quality_status（收进来的数对不对）是两件事，
            两者同名叫「状态」但说的不是一回事，界面上必须分开措辞。
        freshness_judged:
          type: boolean
          description: |
            这一条有没有真的进新鲜度队列。false 有两种情形：源没启用，或者滞后还在
            容忍范围内。给出来是为了让界面解释得了「表里写着落后 2 天，队列里却没有问题」
            ——阈值是服务端的口径，前端不复制一份。
        quality_status:
          $ref: '#/components/schemas/QualityStatus'
        quality_note: { type: string }
        data_through: { type: string, format: date-time }
        freshness_days: { type: integer, minimum: 0, description: '距今落后的天数' }
    MetricOverview:
      type: object
      description: |
        投后分析 · 指标总览的载荷，形状照 20 §4.1「一个主图表 + 素材矩阵 + 解释区」。
        四件必须上屏的东西各有归属：数据窗口 = window，样本量 = totals.impressions，
        口径 = caliber，置信范围 = confidence 与 ctr_interval。
      required: [window, caliber, comparable, totals, rates, confidence, verdict, verdict_label, note, series, assets, unmatched_objects, unmatched_spend_cents, sources, platforms]
      properties:
        window:
          $ref: '#/components/schemas/MetricWindow'
        caliber:
          $ref: '#/components/schemas/MetricCaliber'
        caliber_conflicts:
          type: array
          items: { type: string }
          description: 非空表示窗口内混了不同口径的数据，此时不给合并排行。
        comparable:
          type: boolean
          description: 口径不一致时为 false——跨平台比较默认关闭 (doc10 §6)。
        comparable_reason: { type: string }
        totals:
          $ref: '#/components/schemas/MetricCounts'
        rates:
          $ref: '#/components/schemas/MetricRates'
        ctr_interval:
          $ref: '#/components/schemas/RateInterval'
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string, description: '三档的中文名，后端给定，前端不得自行翻译。' }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。0 = 按出厂设定判的；**字段缺失表示不知道**（例如从库里按 confidence 重建出来的判定），此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note: { type: string, description: '一句话解释为什么是这个档位。原来叫 confidence_note，改名是为了和其余七处内嵌 Judgement 的地方对齐。' }
        series:
          type: array
          items:
            $ref: '#/components/schemas/PerformancePoint'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetPerformance'
        unmatched_objects: { type: integer, minimum: 0 }
        unmatched_spend_cents:
          type: integer
          minimum: 0
          description: 未匹配对象的花费。计入总盘，但不参与创意级结论 (doc10 §5)。
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceHealth'
        warnings:
          type: array
          items: { type: string }
          description: 数据延迟、追踪异常、样本不足等需要读者先看到的提示。
        platforms:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTotal'
    VariantVerdict:
      type: string
      description: |
        AM-009 的判定阶梯，从严到松。**只有 `attributable` 是「能归到这个变量」**，
        其余四档都是「不能」，只是不能的理由不同：


        - `attributable` 只改了一个特征、两侧样本都够、置信区间不重叠
        - `directional` 方向看得出，但区间重叠或样本只到方向性档
        - `confounded` 同时改了多个特征，或两侧特征完全一致（差异来自特征之外）
        - `low_sample` 任一侧曝光不足 1000，不谈差异
        - `no_features` 至少一边没有内容特征，无从判断改了什么
      enum: [attributable, directional, confounded, low_sample, no_features]
    FeatureDiff:
      type: object
      description: 两个素材之间某个特征的取值差异。未记录的一侧写作「（未记录）」而不是空串。
      required: [key, label, group, baseline, variant, source, admissible]
      properties:
        key: { type: string }
        label: { type: string, description: 中文标签，直接可显示 }
        group: { type: string }
        baseline: { type: string }
        variant: { type: string }
        source:
          type: string
          enum: [ai, human, derived]
          description: >-
            变量来源。derived 从文件算出、human 人工标注、ai 模型推断。两侧来源
            不同时取更弱的那一个——只要有一边是猜的，这条差异就是猜的。
        admissible:
          type: boolean
          description: >-
            这条差异能否进入归因结论。ai 来源恒为 false。为 false 的差异照样列出来
            给人看，只是不参与「改了几个变量」的计数。
    VariantComparison:
      type: object
      description: |
        素材对比 (03 §7.3 / AM-009)。同类型素材两两配对，先识别变量再谈差异。
        `changed_features` 长度 > 1 时 variant_verdict 一定是 `confounded`——差异归不到
        其中任何一个变量上，哪怕数字差得很多。

        这里有两个 verdict，别混：`verdict` 是全模块通用的三档结论，`variant_verdict`
        是素材对比专有的五档，它比三档多回答一件事——归不了因，是因为变量太多，还是
        因为压根没有特征数据。后端字段原名 `verdict`，改名是因为它会遮蔽内嵌 Judgement
        的三档，JSON 里 verdict 键会静默变成 attributable 这类值。
      required: [baseline_asset_id, baseline_title, variant_asset_id, variant_title, changed_features, controlled_count, baseline_counts, variant_counts, baseline_rates, variant_rates, intervals_overlap, variant_verdict, confidence, verdict, verdict_label, note]
      properties:
        baseline_asset_id: { type: string }
        baseline_title: { type: string }
        variant_asset_id: { type: string }
        variant_title: { type: string }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        changed_features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureDiff'
        controlled_count:
          type: integer
          minimum: 0
          description: 两侧取值相同的特征数量——受控变量越多，单变量判定越可信。
        baseline_counts:
          $ref: '#/components/schemas/MetricCounts'
        variant_counts:
          $ref: '#/components/schemas/MetricCounts'
        baseline_rates:
          $ref: '#/components/schemas/MetricRates'
        variant_rates:
          $ref: '#/components/schemas/MetricRates'
        baseline_ctr_interval:
          $ref: '#/components/schemas/RateInterval'
        variant_ctr_interval:
          $ref: '#/components/schemas/RateInterval'
        intervals_overlap:
          type: boolean
          description: 任一侧区间算不出来时按 true 处理——不知道差异是否显著，就不能说它显著。
        ctr_lift: { type: number, description: '相对提升；基线为 0 或缺失时本字段缺失，不退化为 0。' }
        variant_verdict:
          $ref: '#/components/schemas/VariantVerdict'
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。0 = 按出厂设定判的；**字段缺失表示不知道**（例如从库里按 confidence 重建出来的判定），此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note: { type: string, description: 一句话说明为什么是这个判定。 }
    AssetTrend:
      type: object
      description: 单个素材在窗口内的逐日走势。`direction` 为 unknown 表示天数不足或前半段无曝光，不能当成持平。
      required: [asset_id, asset_title, points, active_days, direction, confidence, verdict, verdict_label, note]
      properties:
        asset_id: { type: string }
        asset_title: { type: string }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        points:
          type: array
          items:
            $ref: '#/components/schemas/PerformancePoint'
        active_days: { type: integer, minimum: 0, description: 真正有数据的天数，不是窗口长度。 }
        direction:
          type: string
          enum: [rising, flat, declining, unknown]
        ctr_change: { type: number, description: 后半段相对前半段的点击率变化；算不出时缺失。 }
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。0 = 按出厂设定判的；**字段缺失表示不知道**（例如从库里按 confidence 重建出来的判定），此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note: { type: string }
    FatigueSeverity:
      type: string
      description: |
        03 §7.4 素材疲劳。`likely` 只在两项条件同时成立时给出（曝光放大且点击率下滑，
        或点击率下滑且单次成本上升）；单项恶化只到 `watch`。
      enum: [none, watch, likely]
    FatigueSignal:
      type: object
      description: |
        把窗口按「有数据的天数」对半切开后的前后对比。`alternative_explanations` 一定
        非空——其中「受众变化」永远排除不了：当前没有接入受众构成数据，人群变了和素材
        看腻了在数字上长得一样。
      required: [asset_id, asset_title, first_half, second_half, first_rates, last_rates, severity, confidence, verdict, verdict_label, note]
      properties:
        asset_id: { type: string }
        asset_title: { type: string }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        first_half:
          $ref: '#/components/schemas/MetricCounts'
        second_half:
          $ref: '#/components/schemas/MetricCounts'
        first_rates:
          $ref: '#/components/schemas/MetricRates'
        last_rates:
          $ref: '#/components/schemas/MetricRates'
        ctr_change: { type: number }
        cpa_change: { type: number }
        impression_change: { type: number }
        severity:
          $ref: '#/components/schemas/FatigueSeverity'
        alternative_explanations:
          type: array
          items: { type: string }
          description: 没能排除的其他解释。这里列的是「排除不了」，不是「已排除」。
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。0 = 按出厂设定判的；**字段缺失表示不知道**（例如从库里按 confidence 重建出来的判定），此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note: { type: string }
    AnomalyKind:
      type: string
      description: spike 高于常态 / drop 低于常态 / gap 当天完全没有数据。
      enum: [spike, drop, gap]
    MetricAnomaly:
      type: object
      description: |
        用中位数与 MAD（而非均值与标准差）判定偏离，阈值 3.5，且要求窗口内至少 5 天
        有数据。用标准差的话，一次大促尖峰会把标准差本身抬高，之后什么都不再异常。
      required: [date, scope, metric, kind, observed, median, deviation, confidence, verdict, verdict_label, note]
      properties:
        date: { type: string, format: date }
        scope:
          type: string
          enum: [project, asset]
        asset_id: { type: string }
        asset_title: { type: string }
        metric: { type: string }
        kind:
          $ref: '#/components/schemas/AnomalyKind'
        observed: { type: number }
        median: { type: number }
        deviation: { type: number, description: 偏离中位数多少个 MAD。 }
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。0 = 按出厂设定判的；**字段缺失表示不知道**（例如从库里按 confidence 重建出来的判定），此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note: { type: string }
    FeatureDriver:
      type: object
      description: |
        驱动因素：某个特征取值的素材组，与其余素材的对比。**这不是因果**——
        `covarying_features` 列出组内完全同向变化的其他特征，非空时 confidence 一律
        降为 confounded，因为无法区分是本特征还是它们在起作用。
      required: [key, label, group, value, assets, rest_assets, counts, rest_counts, rates, rest_rates, intervals_overlap, confidence, verdict, verdict_label, note]
      properties:
        asset_type:
          $ref: '#/components/schemas/AssetType'
        key: { type: string }
        label: { type: string }
        group: { type: string }
        value: { type: string, description: 该组的特征取值 }
        assets: { type: integer, minimum: 0, description: 组内素材数，少于 2 个不出结论。 }
        rest_assets: { type: integer, minimum: 0 }
        counts:
          $ref: '#/components/schemas/MetricCounts'
        rest_counts:
          $ref: '#/components/schemas/MetricCounts'
        rates:
          $ref: '#/components/schemas/MetricRates'
        rest_rates:
          $ref: '#/components/schemas/MetricRates'
        ctr_interval:
          $ref: '#/components/schemas/RateInterval'
        rest_ctr_interval:
          $ref: '#/components/schemas/RateInterval'
        intervals_overlap: { type: boolean }
        ctr_lift: { type: number }
        covarying_features:
          type: array
          items: { type: string }
          description: 与本特征完全同向变化的其他特征，分不开谁在起作用。
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。0 = 按出厂设定判的；**字段缺失表示不知道**（例如从库里按 confidence 重建出来的判定），此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note:
          type: string
          description: >-
            整块来自它所依据的那条 VariantComparison——档位和理由必须同源，否则会
            出现档位是这次算的、理由是上次的。
    PerformanceAnalysis:
      type: object
      description: 投后分析五个二级视图的共用载荷。
      required: [window, caliber, comparable, judgement, comparisons, trends, fatigue, anomalies, drivers, assets_in_window, assets_with_features]
      properties:
        window:
          $ref: '#/components/schemas/MetricWindow'
        caliber:
          $ref: '#/components/schemas/MetricCaliber'
        judgement:
          allOf:
            - $ref: '#/components/schemas/Judgement'
          description: >-
            整屏的档位，取五类结论里最弱的那一档——一屏里只要有一条算不出来，这一屏
            就不能对外宣称「能归因」。五类全空时为 unclear。这是全模块唯一一处
            judgement 以嵌套对象出现的地方，其余都是平铺内嵌。
        comparable:
          type: boolean
          description: |
            口径不一致时为 false。此时所有 `attributable` 判定会被降级为 directional：
            差异可能整个来自口径，而不是变量。
        comparable_reason: { type: string }
        comparisons:
          type: array
          items:
            $ref: '#/components/schemas/VariantComparison'
        trends:
          type: array
          items:
            $ref: '#/components/schemas/AssetTrend'
        fatigue:
          type: array
          items:
            $ref: '#/components/schemas/FatigueSignal'
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/MetricAnomaly'
        drivers:
          type: array
          items:
            $ref: '#/components/schemas/FeatureDriver'
        assets_in_window: { type: integer, minimum: 0 }
        assets_with_features:
          type: integer
          minimum: 0
          description: 其中有内容特征的素材数。它远小于 assets_in_window 时，对比和驱动因素都会大面积空着。
        notes:
          type: array
          items: { type: string }
          description: 影响整份分析可读性的前置提示（口径冲突、特征覆盖不足等）。
    QualityIssueKind:
      type: string
      description: |
        质量问题的五个类别，对应数据质量的前五个二级视图（第六个「修复队列」是跨类别的
        队列视图，不是第六个类别）。
      enum: [freshness, missing, anomaly, caliber, reconciliation]
    QualitySeverity:
      type: string
      description: |
        blocking 会让整个 Project 暂停强结论与自动优化 (PRD §10.3、doc10 §12.4)；
        warning 结论仍可给出但必须带着这条一起看；info 只记一笔。
      enum: [blocking, warning, info]
    QualityIssueState:
      type: string
      description: |
        问题当前的处置状态。open 与 reopened 不入库，由实时检测与处置记录比对算出：


        - `open` 还没人碰过
        - `acknowledged` 有人在跟，仍留在修复队列
        - `resolved` 已修复且此后没再被观测到
        - `ignored` 判定这条不用管，再次检出也不弹回来
        - `reopened` 报了修但问题在那之后又出现——必须被看见，否则点一次「已修复」
          就能让问题永久消失
      enum: [open, acknowledged, resolved, ignored, reopened]
    QualityDispositionState:
      type: string
      description: 能被写进库的三种处置，是 QualityIssueState 的子集。
      enum: [acknowledged, resolved, ignored]
    QualityDisposition:
      type: object
      description: 库里那一行：谁、什么时候、把哪条问题标成了什么、依据是什么。
      required: [id, organization_id, project_id, fingerprint, issue_kind, state, note, observed_through, version, decided_by, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        fingerprint: { type: string }
        issue_kind:
          $ref: '#/components/schemas/QualityIssueKind'
        state:
          $ref: '#/components/schemas/QualityDispositionState'
        note: { type: string, maxLength: 1000 }
        observed_through:
          type: string
          format: date-time
          description: 处置发生时该问题的最新观测时间。检测到更晚的观测就说明问题又发生了。
        version: { type: integer, minimum: 1 }
        decided_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QualityIssue:
      type: object
      description: 检测器实时算出的一条问题，叠加处置状态后返回。
      required: [fingerprint, kind, severity, title, detail, suggestion, scope_label, affected_spend_cents, last_observed_at, state]
      properties:
        fingerprint:
          type: string
          description: >-
            同一个问题反复出现时保持不变，处置记录才跟得住。**不含数据窗口**——含了的话
            换一次窗口指纹就变，处置永远跟不住同一个问题。
        kind:
          $ref: '#/components/schemas/QualityIssueKind'
        severity:
          $ref: '#/components/schemas/QualitySeverity'
        title: { type: string, description: '一句话说清出了什么事。' }
        detail: { type: string, description: '可核对的具体数字。' }
        suggestion:
          type: string
          description: 下一步该查什么 (PRD §10.3「先建议检查追踪、匹配和同步」)，不要只报警不给动作。
        scope_label: { type: string }
        data_source_id: { type: string }
        platform:
          $ref: '#/components/schemas/Platform'
        affected_spend_cents: { type: integer, minimum: 0 }
        affected_days: { type: integer, minimum: 0 }
        stat_date: { type: string, format: date }
        last_observed_at:
          type: string
          format: date-time
          description: 处置时由前端原样回传，用来判断处置之后问题有没有再出现。
        state:
          $ref: '#/components/schemas/QualityIssueState'
        disposition:
          $ref: '#/components/schemas/QualityDisposition'
    QualityReport:
      type: object
      description: |
        数据质量六视图的载荷。20 §4.1：问题队列为主，影响范围和修复状态为辅，
        错误与延迟置顶——issues 已按「在队列里 → 严重度 → 影响花费」排好序。
      required: [window, generated_at, issues, by_kind, open_count, queue_count, strong_conclusions_allowed]
      properties:
        window:
          $ref: '#/components/schemas/MetricWindow'
        generated_at: { type: string, format: date-time }
        issues:
          type: array
          items:
            $ref: '#/components/schemas/QualityIssue'
        by_kind:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: 五个类别视图的角标，只数还留在修复队列里的。
        open_count: { type: integer, minimum: 0, description: 'open 加 reopened 的条数。' }
        queue_count: { type: integer, minimum: 0 }
        strong_conclusions_allowed:
          type: boolean
          description: >-
            为 false 时投前与投后都不应给出强结论或自动优化动作 (PRD §10.3、doc10 §12.4)。
            已被忽略的问题不参与判断——那是有人明确判过它不影响结论。
        blocked_reason: { type: string }
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceHealth'
          description: 新鲜度视图的底表：每个数据源截止到哪天、滞后多少。
    MetricKind:
      type: string
      enum: [fact, derived]
      description: >-
        `fact` 是平台事实计数，可以跨天相加；`derived` 是派生比率，只能用「总量除总量」
        重算。把每天的比率平均起来是另一个数，而且几乎总是错的。
    CaliberFactor:
      type: string
      enum: [time_zone, currency, attribution_window, metric_schema_version]
      description: doc10 §6 的四个口径要素。
    MetricDictionaryEntry:
      type: object
      required: [key, label, kind, definition, source, day_count, total, comparable]
      properties:
        key: { type: string }
        label: { type: string }
        kind:
          $ref: '#/components/schemas/MetricKind'
        unit: { type: string }
        definition: { type: string }
        formula: { type: string, description: '派生指标的计算式，事实指标没有。' }
        caliber_factors:
          type: array
          items:
            $ref: '#/components/schemas/CaliberFactor'
          description: 这个指标的口径依赖哪些要素。只有依赖的要素冲突了才会影响它的可比性。
        source: { type: string, description: 口径出处（文档章节）。 }
        day_count: { type: integer, minimum: 0, description: '本项目实际有多少天导过这个指标。0 表示一条都没有，和「有值但为 0」不是一回事。' }
        total: { type: number, description: '事实指标是窗口内合计，派生指标是用合计重算出的比率。' }
        comparable:
          type: boolean
          description: 为 false 表示不同数据源在这个指标依赖的口径要素上不一致，跨源对比前必须先展示差异 (03 §7)。
        conflict_notes:
          type: array
          items:
            $ref: '#/components/schemas/CaliberFactor'
    CaliberConflict:
      type: object
      required: [factor, label, values, note]
      properties:
        factor:
          $ref: '#/components/schemas/CaliberFactor'
        label: { type: string }
        values: { type: array, items: { type: string }, description: 各数据源当前的取值。 }
        note: { type: string, description: 这条不一致会让哪些数字对不上。 }
    FeatureValueUsage:
      type: object
      required: [value, asset_count]
      properties:
        value: { type: string }
        asset_count: { type: integer, minimum: 0 }
    FeatureFieldUsage:
      type: object
      description: 一个特征字段的定义加上它在本项目的实际使用情况。
      required: [key, label, group, kind, governed, asset_count, distinct_values]
      properties:
        key: { type: string }
        label: { type: string }
        group: { type: string }
        kind:
          $ref: '#/components/schemas/FeatureValueKind'
        vocabulary: { type: array, items: { type: string } }
        unit: { type: string }
        note: { type: string }
        governed:
          type: boolean
          description: >-
            词表已发布。为 false 的枚举字段目前接受任何取值 (03 §5 末把词表发布权
            交给本模块的管理员)，这正是碎片化的敞口。
        asset_count: { type: integer, minimum: 0, description: 有多少条素材填了这个字段。 }
        distinct_values: { type: integer, minimum: 0, description: 生效值去重后的取值数。 }
        values:
          type: array
          items:
            $ref: '#/components/schemas/FeatureValueUsage'
          description: >-
            按使用量降序，最多 12 个。统计用**生效值**：同一条素材上人工结论覆盖机器结论
            (03 §14)，机器的旧值不再计入，否则「机器写 A、人改成 B」会被数成两个取值。
        merge_candidates:
          type: array
          items: { type: string }
          description: 全项目只有一条素材用过的取值。是候选不是结论——它可能是同义碎片，也可能就是那条素材独有。
        off_vocabulary:
          type: array
          items: { type: string }
          description: 词表发布之前存下来的、不在词表内的存量取值。
        source_counts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: >-
            这个字段生效的取值分别由谁写下的，键是 FeatureSource (derived / human / ai)，
            值是素材条数。归因只认 derived 和 human——一个八成取值都是 ai 写的字段，
            拿它分组比出来的差异说明不了问题，而只看 asset_count 看不出这一点。
            没有任何素材填过这个字段时缺省。
    FeatureSystemHealth:
      type: object
      required: [asset_type, label, source, asset_count, field_count, used_field_count, open_enum_count, fields]
      properties:
        asset_type:
          $ref: '#/components/schemas/AssetType'
        label: { type: string }
        source: { type: string }
        asset_count: { type: integer, minimum: 0 }
        field_count: { type: integer, minimum: 0 }
        used_field_count: { type: integer, minimum: 0 }
        open_enum_count: { type: integer, minimum: 0, description: 还没发布词表的枚举字段数。 }
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFieldUsage'
    SkillHealth:
      type: object
      required: [skill_id, skill_version, extraction_count, asset_count, field_keys, high_confidence, medium_confidence, low_confidence, latest]
      properties:
        skill_id: { type: string }
        skill_version: { type: string }
        extraction_count: { type: integer, minimum: 0 }
        asset_count: { type: integer, minimum: 0 }
        field_keys: { type: array, items: { type: string } }
        high_confidence: { type: integer, minimum: 0 }
        medium_confidence: { type: integer, minimum: 0 }
        low_confidence: { type: integer, minimum: 0 }
        first_extracted_at: { type: string, format: date-time }
        last_extracted_at: { type: string, format: date-time }
        latest:
          type: boolean
          description: >-
            按最近一次提取时间判定在用，不按版本号字符串排序——字符串排序会把 v9 排在
            v10 后面。历史版本提的特征还在库里，所以旧版本也会列出来。
    EvaluationExample:
      type: object
      required: [asset_id, feature_key, label, ai_value, human_value]
      properties:
        asset_id: { type: string }
        asset_title: { type: string }
        feature_key: { type: string }
        label: { type: string }
        ai_value: { type: string }
        human_value: { type: string }
    FieldEvaluation:
      type: object
      required: [key, label, reviewed, agreed]
      properties:
        key: { type: string }
        label: { type: string }
        reviewed: { type: integer, minimum: 0 }
        agreed: { type: integer, minimum: 0 }
    SkillEvaluation:
      type: object
      description: |
        一个 Skill 版本的人机一致率。**不是独立评测集**：样本全部来自人工复核记录，
        回答的是「被人看过的地方机器错了多少」。


        一致与否按取值文本判定，不看 `review_state`——人工行的 `review_state` 默认就是
        `confirmed`，写一个完全不同的值也还是 `confirmed`，拿它当「认可了 AI」会把改写
        数成一致。`rejected` 是人明确推翻，无论取值是否碰巧相同都算不一致。
      required: [skill_id, skill_version, reviewed, agreed, disagreed, accuracy, confidence, note]
      properties:
        skill_id: { type: string }
        skill_version: { type: string }
        reviewed: { type: integer, minimum: 0, description: 有人工结论对照的提取条数。没人看过的不算。 }
        agreed: { type: integer, minimum: 0 }
        disagreed: { type: integer, minimum: 0 }
        accuracy:
          type: number
          description: 样本少于 10 条时恒为 0，此时前端必须藏起这个数而不是显示 0%。
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        note: { type: string, description: 为什么是这个置信档位。 }
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldEvaluation'
        examples:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationExample'
          description: 机器与人写得不一样的具体例子，最多 20 条。看不到例子的准确率没法改进 Skill。
    OperationsTodo:
      type: object
      required: [kind, severity, title, detail]
      properties:
        kind: { type: string, description: 'vocabulary / merge / caliber / evaluation 之一。' }
        severity: { type: string }
        title: { type: string }
        detail: { type: string }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        feature_key: { type: string }
    OperationsDashboard:
      type: object
      description: 质量看板。数字全部由同一次计算得出，和另外四个视图必然对得上。
      required: [feature_field_total, feature_field_used, open_vocabulary_fields, merge_candidate_count, off_vocabulary_count, caliber_conflict_count, skill_version_count, evaluation_samples, todos]
      properties:
        feature_field_total: { type: integer, minimum: 0 }
        feature_field_used: { type: integer, minimum: 0 }
        open_vocabulary_fields: { type: integer, minimum: 0 }
        merge_candidate_count: { type: integer, minimum: 0 }
        off_vocabulary_count: { type: integer, minimum: 0 }
        caliber_conflict_count: { type: integer, minimum: 0 }
        skill_version_count: { type: integer, minimum: 0 }
        evaluation_samples: { type: integer, minimum: 0 }
        todos:
          type: array
          items:
            $ref: '#/components/schemas/OperationsTodo'
          description: >-
            词表待办只覆盖**已经有人用过**的开放枚举字段。把六套 schema 里所有没发布词表
            的字段都列进来，真正在散的那几个会被埋掉。
    Thresholds:
      type: object
      description: >-
        有人调过的那些格子。**缺省表示「没人调过这一格」，跟着代码默认值走**，不是 0。
      properties:
        sufficient_impressions: { type: integer, minimum: 1, description: 达到这个曝光量才把置信标成「充分」。 }
        directional_impressions: { type: integer, minimum: 1, description: 低于这个曝光量连方向都不给，直接判「样本不足」。 }
        min_trend_days: { type: integer, minimum: 3, description: 有数据的天数少于这个，趋势判「看不出走势」、疲劳不给结论。 }
        min_anomaly_days: { type: integer, minimum: 4, description: 少于这么多天就没有「常态」可言，一条异常都不报。 }
        min_driver_assets: { type: integer, minimum: 1, description: 某个取值下不足这么多条素材，就不参与驱动因素比较。 }
        max_comparison_assets: { type: integer, minimum: 1, description: 素材对比一次最多并排几条，超出的按花费截断。 }
        quality_window_days: { type: integer, minimum: 1, description: 投前洞察判断「引用的经验背后有没有数据问题」时回看多少天。 }
    ResolvedThresholds:
      type: object
      required:
        - version
        - sufficient_impressions
        - directional_impressions
        - min_trend_days
        - min_anomaly_days
        - min_driver_assets
        - max_comparison_assets
        - quality_window_days
      description: 判定真正拿去用的那份：每格都有值，且带着版本号。
      properties:
        version:
          type: integer
          format: int64
          description: 0 表示没人调过，各格是代码里的出厂设定。
        sufficient_impressions: { type: integer }
        directional_impressions: { type: integer }
        min_trend_days: { type: integer }
        min_anomaly_days: { type: integer }
        min_driver_assets: { type: integer }
        max_comparison_assets: { type: integer }
        quality_window_days: { type: integer }
    SaveThresholdsRequest:
      type: object
      required: [values, reason]
      properties:
        values:
          $ref: '#/components/schemas/Thresholds'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: >-
            为什么改。跟着这一版一起存下来——三个月后有人问「为什么门槛是这个数」，
            这一栏就是答案。
    ThresholdSet:
      type: object
      required: [id, organization_id, version, values, reason, changed_by, changed_at]
      description: 落库的一版。已经存下来的行永远不改，改动只会追加新的一版。
      properties:
        id: { type: string }
        organization_id: { type: string }
        version: { type: integer, format: int64 }
        values:
          $ref: '#/components/schemas/Thresholds'
        reason: { type: string }
        changed_by: { type: string }
        changed_at: { type: string, format: date-time }
    SettingItem:
      type: object
      required: [key, label, value, effect, recommended, deviates, source, basis]
      properties:
        key: { type: string }
        label: { type: string }
        value:
          type: string
          description: 现在生效的值，已格式化成人能读的样子（含单位）。
        effect:
          type: string
          description: >-
            调大调小会发生什么。20 §121 要求「重要阈值显示影响说明」——写「会影响置信度」
            没有意义，这里要写清楚哪一句话会从「有结论」变成「没结论」。
        recommended:
          type: string
          description: 默认推荐值。
        deviates:
          type: boolean
          description: >-
            当前值偏离了推荐值，页面要提示「有人调过它」。由服务端判定，客户端不要自己
            拿 value 和 recommended 比字符串：确认权限那组两边说的是不同的事
            （这个权限管到哪些操作 vs 该发给谁），字面永远不同，一比就会给每一条都
            打上凭空造出来的告警。
        source:
          type: string
          description: 这个值在代码里的位置，例如 `internal/systems/insights/connectors.go:267`。
        basis:
          type: string
          description: >-
            文档依据。没有依据的阈值会显式写「无文档指定值」——那本身就是个待办，
            留空则看不出是没依据还是忘了写。
        editable_key:
          type: string
          description: >-
            非空表示这一条可以改，值是它在 `PUT /thresholds` 请求体 `values` 里的键名。
            缺省表示只读。可写与否标在**条**上而不是标在组上：样本门槛那一组里五个
            判定阈值可以改、「异常判定倍数」不能改（它是统计口径，不是业务标准），
            观察窗口那一组里对比条数和体检窗口可以改、导入行数上限不能改（那是防呆，
            做成可配置等于做成可关闭）。
    SettingGroup:
      type: object
      required: [key, label, state, view, editable, summary, missing, items]
      properties:
        key: { type: string }
        label: { type: string }
        view:
          type: string
          enum: ['', thresholds, health, dictionary, permission]
          description: >-
            这一组落在「设置」入口四组里的哪一组。组和二级视图不再一一对应：
            判定阈值那一屏由样本门槛 + 观察窗口两组拼出来（窗口天数本来就是判定标准的
            一部分），名词表并进变量字典。空字符串表示不在设置页上单开一段——
            只有还没做的组（`not_built`）才允许为空，做了却不展示，就是一组在生效、
            但没人看得见的设置。
        editable:
          type: boolean
          description: 这一组里有格子可以改。由 items 里的 editable_key 汇总而来。
        state:
          type: string
          enum: [in_effect, not_built]
          description: >-
            `in_effect` 这一组的值现在真的在生效；`not_built` 这一组还没有任何东西，
            此时 items 为空、missing 说明缺什么。两者必须渲染成不同的样子。
        summary: { type: string }
        missing:
          type: array
          items: { type: string }
          description: 只在 state 为 not_built 时有内容：缺的到底是什么、现在怎么替代。
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettingItem'
    InsightSettings:
      type: object
      required: [generated_at, editable, editable_note, project_scoped, groups]
      properties:
        generated_at: { type: string, format: date-time }
        editable:
          type: boolean
          description: >-
            这一页上有东西可以改。**逐格的可写与否看 `SettingItem.editable_key`**——
            前端只在有 editable_key 的格子上渲染输入框，其余照旧只读。
            渲染一个改不动的输入框，比直接说「这里改不了」更让人恼火。
        editable_note:
          type: string
          description: 哪些能改、改了会怎样、哪些不能改以及为什么。
        project_scoped:
          type: boolean
          description: 恒为 false。这些值对整个部署生效，路径上的 project_id 只用于鉴权。
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SettingGroup'
          description: >-
            每一组带 `view`，说明它落在设置页四组（判定阈值 · 数据体检 · 变量字典 ·
            确认权限）的哪一组。数据体检那一屏的内容来自 data-quality 端点，
            不出现在这里。
    CapabilityOperations:
      type: object
      required: [window, generated_at, feature_systems, metrics, caliber_conflicts, skills, evaluations, dashboard]
      properties:
        window:
          $ref: '#/components/schemas/MetricWindow'
        generated_at: { type: string, format: date-time }
        feature_systems:
          type: array
          items:
            $ref: '#/components/schemas/FeatureSystemHealth'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricDictionaryEntry'
        caliber_conflicts:
          type: array
          items:
            $ref: '#/components/schemas/CaliberConflict'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillHealth'
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/SkillEvaluation'
        dashboard:
          $ref: '#/components/schemas/OperationsDashboard'
    ResolveQualityIssue:
      type: object
      additionalProperties: false
      required: [fingerprint, issue_kind, state, note, observed_through]
      properties:
        fingerprint: { type: string, minLength: 1, maxLength: 191 }
        issue_kind:
          $ref: '#/components/schemas/QualityIssueKind'
        state:
          $ref: '#/components/schemas/QualityDispositionState'
        note:
          type: string
          minLength: 1
          maxLength: 1000
          description: 三种处置都要写理由：认领要说谁在跟、标记已修要说怎么修的、判定可忽略更要说为什么。
        observed_through:
          type: string
          format: date-time
          description: >-
            回传前端当时看到的那条问题的 `last_observed_at`。由客户端回传而不是服务端取
            now，是为了让「你处置的是你看到的那个版本」成立——中间问题若又恶化，处置不会
            连带把新情况也盖掉。
    RegisterDataSource:
      type: object
      additionalProperties: false
      required: [platform, ingest_mode]
      properties:
        platform:
          $ref: '#/components/schemas/Platform'
        account_label: { type: string, maxLength: 255 }
        account_ref: { type: string, maxLength: 191 }
        ingest_mode:
          $ref: '#/components/schemas/IngestMode'
        credential_ref:
          type: string
          maxLength: 191
          description: >-
            密钥服务里的引用键。看起来像凭据本身的值（Bearer 头、access_token、
            过长的随机串）会被拒绝：凭据不入业务库 (doc10 §9)。
        caliber:
          $ref: '#/components/schemas/MetricCaliber'
        field_mapping:
          type: object
          additionalProperties: { type: string }
    UpdateDataSource:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: { type: integer, minimum: 1 }
        status:
          $ref: '#/components/schemas/DataSourceStatus'
        account_label: { type: string, maxLength: 255 }
        caliber:
          $ref: '#/components/schemas/MetricCaliber'
        field_mapping:
          type: object
          additionalProperties: { type: string }
          description: 整体替换。启用数据源前必须非空。
    SetDataSourceQuality:
      type: object
      additionalProperties: false
      required: [expected_version, quality_status]
      properties:
        expected_version: { type: integer, minimum: 1 }
        quality_status:
          $ref: '#/components/schemas/QualityStatus'
        note:
          type: string
          maxLength: 1000
          description: healthy 以外的取值必填——读者要知道这个数字为什么不能全信。
    MetricRow:
      type: object
      additionalProperties: false
      required: [platform_object_kind, platform_object_id, stat_date, counts]
      properties:
        platform_object_kind: { type: string, enum: [creative, ad] }
        platform_object_id: { type: string, minLength: 1, maxLength: 191 }
        platform_object_name: { type: string, maxLength: 255 }
        stat_date:
          type: string
          format: date
          description: 按数据源时区聚合后的当地日期，YYYY-MM-DD。
        counts:
          $ref: '#/components/schemas/MetricCounts'
        raw:
          type: object
          additionalProperties: true
          description: 平台原始字段留档，便于口径变更后回溯。
    ImportMetrics:
      type: object
      additionalProperties: false
      required: [data_source_id, kind, rows]
      properties:
        data_source_id: { type: string }
        kind:
          $ref: '#/components/schemas/ImportKind'
        source_label: { type: string, maxLength: 255 }
        content_hash:
          type: string
          maxLength: 128
          description: 文件内容哈希；与相同导入范围组合后用于阻止重复导入 (doc10 §8)。
        corrects_batch_id: { type: string, description: 'kind 为 correction 时指向被更正的批次。' }
        rows:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: '#/components/schemas/MetricRow'
        register_objects:
          type: boolean
          description: >-
            为 true 时把行里出现的、尚未登记的平台对象写入 待匹配 队列，而不是猜它
            属于哪个素材版本。

    ExperimentStatus:
      type: string
      enum: [draft, running, concluded]
      description: >-
        `draft` 设计中，变量/分组/门槛都还能改；`running` 已开跑，**分组冻结**；
        `concluded` 已下结论，连人写的解读一起冻住。冻结这件事是「事先登记」的
        全部依据——没有它，谁都可以在看完数据之后往表现好的那组补两条素材。
    ExperimentVerdict:
      type: string
      enum: [supported, refuted, inconclusive]
      description: >-
        系统给的判定，不是人写的解读。`supported` 区间不重叠且变体更好；
        `refuted` 区间不重叠但变体更差；`inconclusive` 区间重叠，样本再多也
        只能说没看出差别。
    GroupComparison:
      type: object
      description: >-
        组间比较结果。**实验中心和投后分析「驱动因素」共用同一套算法**，两者的
        差别只在 note 的措辞：事先登记的分组能说到「归因到这个变量」，事后凑出
        的分组只能说到「相关」。共用一套是为了让这两页永远不会给出互相矛盾的判定。
      required: [counts, rest_counts, rates, rest_rates, intervals_overlap, covarying_features, confidence, verdict, verdict_label, note]
      properties:
        counts:
          $ref: '#/components/schemas/MetricCounts'
        rest_counts:
          $ref: '#/components/schemas/MetricCounts'
        rates:
          $ref: '#/components/schemas/MetricRates'
        rest_rates:
          $ref: '#/components/schemas/MetricRates'
        ctr_interval:
          $ref: '#/components/schemas/RateInterval'
        rest_ctr_interval:
          $ref: '#/components/schemas/RateInterval'
        intervals_overlap:
          type: boolean
          description: 为 true 时差异可能只是波动，不管相对差看起来有多大。
        ctr_lift: { type: number, description: '点击率相对变化；任一侧分母为 0 时缺失' }
        covarying_features:
          type: array
          items: { type: string }
          description: >-
            这一组在被测变量之外还整齐地不同的特征。非空时差异不能只算到被测变量
            头上。事先登记的实验这里恒为空——混杂由入组那道关把守，不在事后翻账。
        confidence:
          $ref: '#/components/schemas/ConfidenceLevel'
        verdict:
          $ref: '#/components/schemas/Verdict'
        verdict_label: { type: string }
        threshold_version: { type: integer, format: int64, description: '判出这条结论时生效的阈值版本。0 = 按出厂设定判的；**字段缺失表示不知道**（例如从库里按 confidence 重建出来的判定），此时前端不得显示任何阈值标注。' }
        upgrade:
          $ref: '#/components/schemas/UpgradePath'
        note: { type: string, description: '给人读的一句话，说明这条判定为什么是这个强度。' }
    ExperimentVariant:
      type: object
      description: 实验的一组。基线组有且只有一个。
      required: [id, organization_id, project_id, experiment_id, name, variable_value, is_baseline, asset_ids, position, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        experiment_id: { type: string }
        name: { type: string, maxLength: 64 }
        variable_value:
          type: string
          maxLength: 200
          description: 这一组在被测变量上的取值。入组素材必须和它对得上。
        is_baseline: { type: boolean }
        asset_ids:
          type: array
          items: { type: string }
        position: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Experiment:
      type: object
      description: 一次事先登记的对照实验（03 §7.3 / AM-009）。
      required: [id, organization_id, project_id, title, hypothesis, asset_type, variable_key, variable_label, controlled_keys, min_impressions, window_start, window_end, status, version, created_by, created_at, updated_at, variants]
      properties:
        id: { type: string }
        organization_id: { type: string }
        project_id: { type: string }
        title: { type: string, maxLength: 200 }
        hypothesis: { type: string, maxLength: 2000 }
        source_experience_id:
          type: string
          description: >-
            假设的出处：投前洞察的假设卡「拿去验证」过来时带上。为空表示空白新建，
            也就是「这条假设没有出处」。实验有结论之后靠它知道该回头更新哪张卡。
        asset_type:
          $ref: '#/components/schemas/AssetType'
        variable_key: { type: string, description: '被测变量，必须是这个素材类型特征体系里的字段，且不能是自由文本。' }
        variable_label: { type: string }
        controlled_keys:
          type: array
          items: { type: string }
          description: 要求各组一致的其他特征。不一致不拦，入组时给黄牌。
        min_impressions:
          type: integer
          format: int64
          minimum: 1
          description: >-
            **事先**定的每组最低展示量。事后再定门槛等于允许「凑够了就说显著」，
            所以开跑之后不能改。
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        status:
          $ref: '#/components/schemas/ExperimentStatus'
        verdict:
          $ref: '#/components/schemas/ExperimentVerdict'
        interpretation: { type: string, maxLength: 2000, description: '人写的解读。判定由系统给，解读由人负责，两者分开存。' }
        concluded_by: { type: string }
        concluded_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentVariant'
    VariantSample:
      type: object
      description: >-
        一组的样本量，以及够不够事先定的门槛。**这一层永远返回**，包括不够的时候：
        知道还差多少才知道还要投多久。不够时被藏起来的是对比数字，不是样本数字。
      required: [variant_id, name, variable_value, is_baseline, assets, assets_with_data, impressions, clicks, meets_threshold, short_by]
      properties:
        variant_id: { type: string }
        name: { type: string }
        variable_value: { type: string }
        is_baseline: { type: boolean }
        assets: { type: integer, description: '这一组里的素材条数' }
        assets_with_data: { type: integer, description: '其中窗口内真的有投放数据的条数' }
        impressions: { type: integer, format: int64 }
        clicks: { type: integer, format: int64 }
        meets_threshold: { type: boolean, description: '为 false 时，这一组参与的所有对比都不出数字。' }
        short_by: { type: integer, format: int64, description: '还差多少次展示到门槛。' }
    ExperimentComparison:
      type: object
      description: 某个变体组 vs 基线组。
      required: [variant_id, variant_name, variant_value, baseline_id, baseline_name, baseline_value, blocked]
      properties:
        variant_id: { type: string }
        variant_name: { type: string }
        variant_value: { type: string }
        baseline_id: { type: string }
        baseline_name: { type: string }
        baseline_value: { type: string }
        blocked:
          type: boolean
          description: >-
            **为 true 时 result 和 verdict 一定不存在。** 这是有意的：样本不达标却
            显示 CTR 差异，人会先看见数字再看见提示，然后记住数字。
        blocker: { type: string, description: '拦下的原因，含还差多少展示。' }
        result:
          $ref: '#/components/schemas/GroupComparison'
        verdict:
          $ref: '#/components/schemas/ExperimentVerdict'
    ExperimentReadout:
      type: object
      description: 实验详情页的全部读数。每次现算，不落库。
      required: [window, caliber, comparable, samples, comparisons, ready, notes]
      properties:
        window:
          $ref: '#/components/schemas/MetricWindow'
        caliber:
          $ref: '#/components/schemas/MetricCaliber'
        comparable:
          type: boolean
          description: 沿用投后分析的口径判定：窗口内混了币种/归因窗口/指标版本/平台时为 false。
        comparable_reason: { type: string }
        samples:
          type: array
          items:
            $ref: '#/components/schemas/VariantSample'
        comparisons:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentComparison'
        ready:
          type: boolean
          description: 每一组都过了门槛才为 true。为 false 时下结论会被拒绝。
        verdict:
          $ref: '#/components/schemas/ExperimentVerdict'
        notes:
          type: array
          items: { type: string }
    ExperimentDetail:
      type: object
      required: [experiment, readout]
      properties:
        experiment:
          $ref: '#/components/schemas/Experiment'
        readout:
          $ref: '#/components/schemas/ExperimentReadout'
    CreateVariant:
      type: object
      additionalProperties: false
      required: [name, variable_value]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        variable_value: { type: string, minLength: 1, maxLength: 200 }
        is_baseline: { type: boolean }
    CreateExperiment:
      type: object
      additionalProperties: false
      required: [title, asset_type, variable_key, min_impressions, window_start, window_end, variants]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        hypothesis: { type: string, maxLength: 2000 }
        source_experience_id: { type: string, description: '投前洞察假设卡「拿去验证」时带上；空白新建时留空。' }
        asset_type:
          $ref: '#/components/schemas/AssetType'
        variable_key: { type: string, minLength: 1 }
        controlled_keys:
          type: array
          items: { type: string }
        min_impressions: { type: integer, format: int64, minimum: 1 }
        window_start: { type: string, format: date }
        window_end: { type: string, format: date }
        variants:
          type: array
          minItems: 2
          maxItems: 8
          description: 至少两组，且恰好一组 is_baseline。只有一组就没有对照，也就没有实验。
          items:
            $ref: '#/components/schemas/CreateVariant'
    AttachExperimentAssetResult:
      type: object
      description: >-
        变量取值对不上是硬拦（返回错误）；控住的变量不一致只给黄牌。真实素材很难只差
        一个变量，硬拦会让实验一个都建不起来，不说又会让结论被当成干净对照。
      required: [variant, warnings]
      properties:
        variant:
          $ref: '#/components/schemas/ExperimentVariant'
        warnings:
          type: array
          items: { type: string }
    ConcludeExperiment:
      type: object
      additionalProperties: false
      required: [interpretation]
      description: >-
        **没有 verdict 字段。** 判定由系统按事先定的门槛和置信区间给出——判定要是
        能传，门槛就形同虚设。
      properties:
        expected_version: { type: integer, format: int64 }
        interpretation:
          type: string
          minLength: 1
          maxLength: 2000
          description: 人写的解读。只留一个判定，读的人无从知道这条结论该怎么用。
